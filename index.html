<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sardina Destiny Tarot</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #001a33;
            --gold: #d4af37;
            --white: #f8f9fa;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--white);
            font-family: 'Gowun Dodum', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-user-select: none; /* 드래그 방지 */
            user-select: none;
        }

        h1 {
            color: var(--gold);
            margin-bottom: 5px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            text-align: center;
        }

        .subtitle {
            margin-bottom: 15px;
            font-size: 0.95rem;
            opacity: 0.8;
            text-align: center;
            line-height: 1.4;
        }

        .visitor-count {
            font-size: 0.95rem;
            color: var(--gold);
            margin-bottom: 30px;
            opacity: 0.9;
        }

        #visitor-number {
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .card-container {
            display: flex;
            gap: 20px;
            perspective: 1000px;
            position: relative;
        }

        .card {
            width: 100px;
            height: 160px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card:hover { transform: translateY(-10px); }
        .card.is-flipped { transform: translateY(-10px) rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 2px solid var(--gold);
            box-sizing: border-box;
            overflow: hidden; 
            background-color: var(--white);
        }

        .card-back {
            background: 
                radial-gradient(var(--gold) 1px, transparent 1px),
                linear-gradient(135deg, #002b55 25%, #001a33 100%);
            background-size: 15px 15px, 100% 100%;
        }

        .card-front {
            transform: rotateY(180deg);
        }

        .front-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 셔플 애니메이션 */
        .shuffling .card:nth-child(1) { transform: translateX(120px) rotate(-10deg); z-index: 3; }
        .shuffling .card:nth-child(2) { transform: translateX(0) rotate(5deg); z-index: 2; }
        .shuffling .card:nth-child(3) { transform: translateX(-120px) rotate(-15deg); z-index: 1; }

        #result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 380px;
            background: var(--white);
            color: #222;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--gold);
            z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            animation: fadeIn 0.4s ease;
            text-align: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -45%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        #result-img {
            width: 100px; height: auto; border-radius: 5px; margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        #result-modal h2 { color: #002b55; margin-bottom: 10px; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        #result-modal p { line-height: 1.6; font-size: 0.95rem; text-align: left; margin: 10px 0; }
        .twist { color: #2e6299; font-weight: bold; display: block; text-align: left; }

        .close-btn {
            background: var(--primary-bg); color: var(--gold); border: none;
            padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%;
            margin-top: 20px; font-weight: bold; font-family: inherit;
        }

.twitter-share-btn {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    width: fit-content;
    margin: 15px auto 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Gowun Dodum', sans-serif; 
    font-size: 0.85rem;
    transition: all 0.3s ease;
    text-decoration: none;
}

        @media (max-width: 400px) {
            .card-container { gap: 10px; }
            .card { width: 85px; height: 140px; }
        }
    </style>
</head>
<body>

    <h1>🔮 SARDINA DESTINY</h1>
    <p class="subtitle">사르디나의 바다가 당신의 운명을 비춥니다.<br>마음이 가는 카드를 선택하세요.</p>
    
    <div class="visitor-count">
        당신은 운명의 <span id="visitor-number">...</span> 번째 방문자군요!
    </div>

    <div class="card-container" id="deck">
        <div class="card" onclick="drawCard(this)">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"><img class="front-img" src="" alt="Card"></div>
        </div>
        <div class="card" onclick="drawCard(this)">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"><img class="front-img" src="" alt="Card"></div>
        </div>
        <div class="card" onclick="drawCard(this)">
            <div class="card-face card-back"></div>
            <div class="card-face card-front"><img class="front-img" src="" alt="Card"></div>
        </div>
    </div>

    <div id="result-modal">
        <img id="result-img" src="" alt="Tarot Card">
        <h2 id="card-title">카드 이름</h2>
        <p id="card-desc">내용...</p>
        <span id="card-twist" class="twist">트위스트...</span>
        
        <button class="twitter-share-btn" onclick="shareTwitter()">트위터에 결과 공유하기</button>
        <button class="close-btn" onclick="closeAndShuffle()">운명 받아들이기 ✨</button>
    </div>

    <script>
        // 기초 데이터
        const tarotData = [
            { id: 0, title: "0. THE FOOL (광대)", desc: "새로운 시작과 얽매이지 않는 순수함을 상징합니다. 당신의 앞날에 생각지도 못한 즐거운 일탈이 기다리고 있군요!", twist: "예를 들면... 산더미 같은 서류를 뒤로 하고 바닷가로 데이트를 나선 닻과 파도를 목격하는 일 말이죠." },
            { id: 1, title: "I. THE MAGICIAN (마법사)", desc: "무에서 유를 창조하는 의지와 능력입니다. 불가능해 보였던 일들이 당신의 눈앞에서 실현될 수 있습니다.", twist: "분 단위로 짜인 일정을 마법처럼 비워내고, 애송이와 여유로운 티타임을 가지는 닻을 보게 될 겁니다." },
            { id: 2, title: "II. THE HIGH PRIESTESS (여사제)", desc: "뛰어난 직관과 숨겨진 비밀을 의미합니다. 굳이 말하지 않아도 상황의 이면을 꿰뚫어 보게 될 징조입니다.", twist: "무심한 듯 보이는 닻의 시선 끝이 언제나 파란 머리의 보좌관을 향해 있다는 비밀을 당신만 눈치채게 되겠군요." },
            { id: 3, title: "III. THE EMPRESS (여황제)", desc: "풍요와 헌신적인 사랑, 포용력을 뜻합니다. 누군가의 따뜻한 보살핌을 받거나, 평화로운 하루를 보냅니다.", twist: "사르디나의 공기가 유독 포근하네요. 나란히 걸어가는 두 사람의 달콤한 기류를 보며 흐뭇한 웃음이 나옵니다." },
            { id: 4, title: "IV. THE EMPEROR (황제)", desc: "견고한 권위와 책임감, 흔들리지 않는 기반을 의미합니다. 리더십을 발휘하여 상황을 통제하게 됩니다.", twist: "'오늘은 내 곁에만 머물도록 해. 이건 명령이다.' 라며 사심 가득한 권력을 남용하는 닻을 직관하게 됩니다." },
            { id: 5, title: "V. THE HIEROPHANT (교황)", desc: "전통과 규칙, 그리고 구성원들 간의 암묵적인 동의를 상징합니다. 조언을 구하거나 규칙을 따르는 것이 좋습니다.", twist: "의회당의 암묵적 규칙: '두 사람이 단둘이 있을 땐 집무실 문을 두드리지 말 것.' 오늘 당신은 이 규칙을 뼈저리게 새깁니다." },
            { id: 6, title: "VI. THE LOVERS (연인)", desc: "조화와 결합, 그리고 완벽한 소통을 의미합니다. 오늘은 주변 사람들과 아주 깊고 따뜻한 관계를 맺게 될 운명입니다.", twist: "의회당 뒷편 정원에서 닻과 파도의 애정 어린 시간을 목격하겠군요. 눈치껏 자리를 비켜주는 것이 예의입니다." },
            { id: 7, title: "VII. THE CHARIOT (전차)", desc: "거침없는 추진력과 승리를 상징합니다. 목표를 향해 앞뒤 재지 않고 달려갈 때입니다.", twist: "술기운을 빌려 직진하는 파도의 엄청난 추진력을 목격합니다. 당황해 귀끝이 붉어진 닻은 덤이죠." },
            { id: 8, title: "VIII. STRENGTH (힘)", desc: "부드러움이 강함을 이기는 내면의 용기와 인내를 뜻합니다. 어떤 어려움도 사랑과 포용으로 극복할 수 있습니다.", twist: "200년간의 관록이, 해사하게 웃으며 다가오는 파도 앞에서는 속수무책으로 녹아내리는 과정을 실시간으로 봅니다." },
            { id: 9, title: "IX. THE HERMIT (은둔자)", desc: "내면의 탐구와 고독, 과거에 대한 성찰을 상징합니다. 혼자만의 시간을 가지며 답을 찾을 때입니다.", twist: "밤바다를 보며 상념에 잠긴 닻. 이토록 속수무책으로 밀려드는 파도를 어떻게 받아들여야 할지, 진지한 해답을 찾는 중입니다." },
            { id: 10, title: "X. WHEEL OF FORTUNE (운명의 수레바퀴)", desc: "피할 수 없는 변화와 행운의 흐름입니다. 운명적인 만남이나 필연적인 사건이 일어날 징조입니다.", twist: "해변에 버려졌던 아이가 마침내 동경하던 닻의 곁에 자리하게 되다니, 이보다 완벽한 운명이 있을까요?" },
            { id: 11, title: "XI. JUSTICE (정의)", desc: "균형과 공정함, 원인과 결과의 명확함을 의미합니다. 저울이 평형을 이루듯 공평한 상황이 찾아옵니다.", twist: "'저만 애송이 취급하고!' 투덜대는 파도의 이마에, 닻이 입을 맞춰 불만을 공평하게 잠재우는 현장입니다." },
            { id: 12, title: "XII. THE HANGED MAN (매달린 사람)", desc: "시각의 전환과 자발적인 희생을 상징합니다. 멈춰 서서 상황을 다른 각도로 바라보게 됩니다.", twist: "파도를 풋내기 취급하던 닻이, 이제는 자발적으로 영원을 약속하고 싶어 하는 시각의 전환을 겪습니다." },
            { id: 13, title: "XIII. DEATH (죽음)", desc: "과거의 완전한 종료와 새로운 시작, 부활을 뜻합니다. 낡은 것은 가고 새로운 아침이 밝아옵니다.", twist: "장마철마다 찾아들던 파도의 악몽이 어젯밤을 기점으로 완전히 끝났군요. 닻이 밤새 곁을 지켰기 때문일까요?" },
            { id: 14, title: "XIV. TEMPERANCE (절제)", desc: "이질적인 것들의 조화와 화합, 그리고 타협을 의미합니다. 서로 다른 두 요소가 만나 완벽한 혼합물을 이룹니다.", twist: "신중한 닻과 솔직한 파도. 전혀 다를 것 같은 두 사람이 어느덧 서로에게 완벽하게 스며들어 함께하고 있습니다." },
            { id: 15, title: "XV. THE DEVIL (악마)", desc: "끊을 수 없는 유혹과 강렬한 집착을 상징합니다. 이성으로는 안 된다는 걸 알면서도 끌리게 됩니다.", twist: "'집무실에서는 안 된다고 했을 텐데.' 타박하면서도, 기꺼이 안겨오는 파도를 마주 끌어안고야 마는 닻입니다." },
            { id: 16, title: "XVI. THE TOWER (탑)", desc: "갑작스러운 변화와 기존 가치관의 붕괴를 의미합니다. 예측하지 못한 충격이 찾아옵니다.", twist: "철두철미하던 닻의 마음이, 울망한 얼굴로 속삭이는 '로잔나...' 한 마디에 와르르 무너져 내리고야 맙니다." },
            { id: 17, title: "XVII. THE STAR (별)", desc: "희망과 치유, 그리고 영감을 상징합니다. 어두운 밤하늘을 밝히는 별처럼 긍정적인 에너지가 가득합니다.", twist: "저 멀리서부터 반짝이는 건 서로의 손에 끼워진 반지로군요! 닻과 파도의 앞날이 저 별처럼 눈부십니다." },
            { id: 18, title: "XVIII. THE MOON (달)", desc: "불안과 환상, 숨겨진 두려움을 뜻합니다. 어둠 속에서 진실이 모호하게 보일 수 있습니다.", twist: "악몽에 뒤척이는 파도의 곁을 조용히 지키며, 이불을 덮어주는 닻의 은밀한 다정함을 우연히 목격하고 맙니다." },
            { id: 19, title: "XIX. THE SUN (태양)", desc: "밝은 에너지, 기쁨, 그리고 완벽한 성공을 의미합니다. 그늘 없이 모든 것이 환하게 빛나는 하루입니다.", twist: "해사하게 웃는 파도의 얼굴이 사르디나의 태양보다 밝습니다. 그를 마주하는 닻의 미소는 모든 것을 거머쥔 승리자 같군요." },
            { id: 20, title: "XX. JUDGEMENT (심판)", desc: "부름과 각성, 그리고 부활을 상징합니다. 과거의 짐을 벗어던지고 새로운 단계로 나아갑니다.", twist: "반려를 맞이한 사르디나의 종신 통령이 새로운 내일을 선포합니다. (그리고 오늘은 국경일로 지정됩니다.)" },
            { id: 21, title: "XXI. THE WORLD (세계)", desc: "완성과 통합, 그리고 하나의 주기가 성공적으로 끝남을 의미합니다. 더할 나위 없이 완벽한 상태입니다.", twist: "변치 않고 자리를 지키는 닻과 끊임없이 밀려와 스며드는 파도. 두 사람의 완벽한 세계가 완성되었습니다." }
        ];

        let canDraw = false;

        window.onload = () => {
            shuffleAndDeal();
            fetchVisitorCount();
        };

        function fetchVisitorCount() {
            fetch('https://api.counterapi.dev/v1/sardina_destiny/tarot_event/up')
                .then(res => res.json())
                .then(data => { document.getElementById('visitor-number').innerText = data.count; })
                .catch(() => { document.getElementById('visitor-number').innerText = "특별한"; });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function shuffleAndDeal() {
            canDraw = false;
            const deck = document.getElementById('deck');
            const cards = document.querySelectorAll('.card');
            
            deck.classList.add('shuffling');
            cards.forEach(card => card.classList.remove('is-flipped'));

            setTimeout(() => {

                let allIds = Array.from({length: 22}, (_, i) => i);
                shuffleArray(allIds);
                
                const selectedIds = allIds.slice(0, 3);

                cards.forEach((card, index) => {
                    const cardId = selectedIds[index];
                    const img = card.querySelector('.front-img');

                    card.dataset.cardId = cardId;
                    img.src = `assets/${cardId}.jpg`;
                });

                deck.classList.remove('shuffling');
                setTimeout(() => { canDraw = true; }, 500);
            }, 600);
        }

        function drawCard(cardElement) {
            if (!canDraw || cardElement.classList.contains('is-flipped')) return;
            canDraw = false;

            cardElement.classList.add('is-flipped');

            const realCardId = parseInt(cardElement.dataset.cardId);
            const result = tarotData.find(d => d.id === realCardId);

            setTimeout(() => {
                document.getElementById('result-img').src = `assets/${realCardId}.jpg`;
                document.getElementById('card-title').innerText = result.title;
                document.getElementById('card-desc').innerText = result.desc;
                document.getElementById('card-twist').innerText = result.twist;
                document.getElementById('result-modal').style.display = 'block';
            }, 800);
        }

        function closeAndShuffle() {
            document.getElementById('result-modal').style.display = 'none';
            shuffleAndDeal();
        }

        function shareTwitter() {
            const cardTitle = document.getElementById('card-title').innerText;
            const text = `${cardTitle}을 뽑았습니다! 사르디나의 바다가 비춘 나의 운명도 확인해볼까요? 🔮\nhttps://sardina-tarot.netlify.app/`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
    </script>
</body>
</html>
