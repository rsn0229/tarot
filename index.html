<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sardina Destiny Tarot</title>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sardina-tarot.netlify.app/">
    <meta property="og:title" content="🔮 Sardina Destiny Tarot">
    <meta property="og:description" content="사르디나의 바다가 당신의 운명을 비춥니다. 마음이 가는 카드를 선택하세요.">
    <meta property="og:image" content="https://sardina-tarot.netlify.app/assets/thumb.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🔮 Sardina Destiny Tarot">
    <meta name="twitter:description" content="사르디나의 바다가 당신의 운명을 비춥니다. 마음이 가는 카드를 선택하세요.">
    <meta name="twitter:image" content="https://sardina-tarot.netlify.app/assets/thumb.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #001a33;
            --secondary-bg: #002b55;
            --gold: #d4af37;
            --gold-light: rgba(212, 175, 55, 0.2);
            --white: #f8f9fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle at 50% 20%, #002b55 0%, #001122 100%);
            color: var(--white);
            font-family: 'Gowun Dodum', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px 50px 15px;
            overflow-x: hidden;
        }

        h1 {
            color: var(--gold);
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
            text-align: center;
        }

        p.subtitle {
            margin: 0 0 12px 0;
            font-size: 0.95rem;
            opacity: 0.85;
            text-align: center;
            line-height: 1.4;
        }

        .visitor-count {
            font-size: 0.9rem;
            color: var(--gold);
            margin-bottom: 20px;
            opacity: 0.9;
            text-align: center;
        }

        #visitor-number {
            font-weight: bold;
            font-size: 1.05rem;
            text-decoration: underline;
            text-underline-offset: 4px;
            padding: 0 4px;
        }

        /* 🧭 모드 전환 탭 버튼 */
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.25);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .tab-btn {
            background: transparent;
            color: var(--white);
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .tab-btn.active {
            background: var(--gold);
            color: var(--primary-bg);
            font-weight: bold;
            opacity: 1;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* 📝 고민 상담 입력창 영역 (3장 모드 전용) */
        #worry-section {
            display: none;
            width: 100%;
            max-width: 520px;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeInSimple 0.4s ease;
        }

        .worry-input-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 12px 15px;
            color: var(--white);
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 0.95rem;
            resize: none;
            height: 70px;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .worry-input-box::placeholder {
            color: rgba(248, 249, 250, 0.5);
        }

        .worry-input-box:focus {
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        /* 선택 현황 안내 텍스트 */
        .pick-guide {
            font-size: 0.95rem;
            color: var(--gold);
            margin: 10px 0 15px 0;
            min-height: 24px;
            text-align: center;
        }

        /* 🎴 22장 전체 스프레드 (촤르르륵 효과) */
        .spread-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 10px;
            min-height: 210px;
            perspective: 1000px;
        }

        .card-spread {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 820px;
            height: 170px;
        }

        .card {
            width: 90px;
            height: 145px;
            cursor: pointer;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.85, 0.3, 1.15), opacity 0.4s;
            box-shadow: -3px 4px 12px rgba(0,0,0,0.6);
            user-select: none;
        }

        /* 카드를 위에 올렸을 때 쏙 올라오는 효과 */
        .card:hover:not(.is-flipped) {
            z-index: 50 !important;
            filter: brightness(1.15);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 2px solid var(--gold);
            overflow: hidden; 
            background-color: var(--white);
        }

        .card-back {
            background: 
                radial-gradient(var(--gold) 1px, transparent 1px),
                linear-gradient(135deg, #002b55 25%, #001a33 100%);
            background-size: 14px 14px, 100% 100%;
        }

        /* 선택된 카드 강조 테두리 */
        .card.selected-pick .card-face {
            border-color: #fff;
            box-shadow: 0 0 15px var(--gold);
        }

        .card-front {
            background-color: var(--white);
            transform: rotateY(180deg);
        }

        .front-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            pointer-events: none; 
            background-color: var(--white); 
        }

        /* 3장 모드에서 뽑은 카드를 보여주는 슬롯 */
        #picked-slots {
            display: none;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
            width: 100%;
            max-width: 420px;
        }

        .slot-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            padding: 8px 5px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            min-height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        .slot-item.filled {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: bold;
        }

        .slot-label {
            font-size: 0.72rem;
            opacity: 0.75;
            margin-bottom: 3px;
        }

        /* 🔮 결과 모달창 */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 10, 20, 0.75);
            z-index: 90;
            backdrop-filter: blur(3px);
        }

        #result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 460px;
            background: var(--white);
            color: #222;
            padding: 25px 22px;
            border-radius: 15px;
            border: 3px solid var(--gold);
            z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.85);
            animation: fadeInModal 0.4s ease;
            text-align: center;
            max-height: 88vh;
            overflow-y: auto;
        }

        @keyframes fadeInModal {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes fadeInSimple {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 1장 결과 이미지 */
        #result-img {
            width: 110px; 
            height: auto;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background-color: var(--white);
        }

        /* 3장 결과 카드 나열 영역 */
        #three-cards-view {
            display: none;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .mini-card-box {
            flex: 1;
            text-align: center;
        }

        .mini-card-box span.pos-badge {
            display: inline-block;
            background: var(--primary-bg);
            color: var(--gold);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 5px;
        }

        .mini-card-box img {
            width: 75px;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid var(--gold);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: block;
            margin: 0 auto 5px auto;
        }

        .mini-card-box .mini-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #002b55;
            word-break: keep-all;
        }

        #result-modal h2 {
            color: #002b55;
            margin: 0 0 12px 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 10px;
        }

        #result-modal p {
            line-height: 1.65;
            font-size: 0.95rem;
            margin-bottom: 8px;
            text-align: left;
            white-space: pre-line;
        }

        .twist {
            color: #2e6299;
            font-weight: bold;
            margin-top: 15px;
            display: block;
            text-align: left;
            background: #f0f6fc;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #2e6299;
        }

        /* 로딩 스피너 */
        .loading-box {
            display: none;
            padding: 25px 10px;
            text-align: center;
            color: #002b55;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 닫기 및 다시 뽑기 버튼 */
        .close-btn {
            background: var(--primary-bg);
            color: var(--gold);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 18px;
            font-weight: bold;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .close-btn:hover { background: #002b55; }

        /* 트위터 공유 버튼 */
        .twitter-share-btn {
            background: transparent;
            color: #002b55;
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            width: fit-content;
            margin: 15px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .twitter-share-btn:hover { 
            background: rgba(212, 175, 55, 0.15); 
            transform: translateY(-2px);
        }

        /* 📱 모바일 반응형 최적화 (22장 카드가 화면 안에 예쁘게 들어오도록 조정) */
        @media (max-width: 600px) {
            .card {
                width: 66px;
                height: 108px;
            }
            .card-spread {
                height: 150px;
            }
            .spread-wrapper {
                min-height: 170px;
                padding: 15px 5px;
            }
            .mini-card-box img {
                width: 62px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <h1>🔮 SARDINA DESTINY</h1>
    <p class="subtitle">사르디나의 바다가 당신의 운명을 비춥니다.<br>마음이 가는 카드를 선택하세요.</p>
    
    <div class="visitor-count">
        당신은 운명의 <span id="visitor-number">...</span> 번째 방문자군요!
    </div>

    <!-- 🧭 모드 선택 탭 -->
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-daily" onclick="switchMode('daily')">🌅 데일리 사르디나 (1장)</button>
        <button class="tab-btn" id="tab-counsel" onclick="switchMode('counsel')">🌙 고민 상담 스프레드 (3장)</button>
    </div>

    <!-- 📝 고민 입력란 (3장 상담 모드일 때만 표시) -->
    <div id="worry-section">
        <textarea id="worry-input" class="worry-input-box" placeholder="사르디나의 바다에 털어놓고 싶은 당신의 고민을 적어주세요... (예: 요즘 준비하는 일이 잘 풀릴까요?)"></textarea>
    </div>

    <div class="pick-guide" id="pick-guide">카드가 촤르르륵 펼쳐지면 1장을 선택해 주세요 ✨</div>

    <!-- 🎴 22장 전체 카드 스프레드 영역 -->
    <div class="spread-wrapper">
        <div class="card-spread" id="deck"></div>
    </div>

    <!-- 3장 선택 시 채워지는 슬롯 표시 -->
    <div id="picked-slots">
        <div class="slot-item" id="slot-0"><span class="slot-label">첫 번째 (과거/원인)</span><span class="slot-name">선택 대기</span></div>
        <div class="slot-item" id="slot-1"><span class="slot-label">두 번째 (현재/상황)</span><span class="slot-name">선택 대기</span></div>
        <div class="slot-item" id="slot-2"><span class="slot-label">세 번째 (미래/조언)</span><span class="slot-name">선택 대기</span></div>
    </div>

    <!-- 🔮 결과 모달 -->
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div id="result-modal">
        <!-- 1장 모드 이미지 -->
        <img id="result-img" src="" alt="Tarot Card" onerror="this.style.display='none'">
        
        <!-- 3장 모드 미니 카드 뷰 -->
        <div id="three-cards-view">
            <div class="mini-card-box">
                <span class="pos-badge">과거 · 원인</span>
                <img id="mini-img-0" src="" alt="Card 1" onerror="this.style.display='none'">
                <div class="mini-title" id="mini-title-0"></div>
            </div>
            <div class="mini-card-box">
                <span class="pos-badge">현재 · 상황</span>
                <img id="mini-img-1" src="" alt="Card 2" onerror="this.style.display='none'">
                <div class="mini-title" id="mini-title-1"></div>
            </div>
            <div class="mini-card-box">
                <span class="pos-badge">미래 · 해답</span>
                <img id="mini-img-2" src="" alt="Card 3" onerror="this.style.display='none'">
                <div class="mini-title" id="mini-title-2"></div>
            </div>
        </div>

        <h2 id="card-title">카드 이름</h2>

        <!-- AI 로딩 중 표시 -->
        <div class="loading-box" id="loading-box">
            <div class="spinner"></div>
            <div>사르디나의 파도가 세 장의 운명을 읽고 있습니다...🌊</div>
        </div>

        <p id="card-desc">기본 리딩 내용...</p>
        <span id="card-twist" class="twist">만우절 트위스트...</span>
        
        <button class="twitter-share-btn" id="twitter-btn" onclick="shareTwitter()">
            트위터에 결과 공유하기
        </button>
        
        <button class="close-btn" onclick="closeAndShuffle()">운명 받아들이기 ✨</button>
    </div>

    <script>
        // =========================================================================
        // 🚀 [중요] 배포하신 Google Apps Script 웹 앱 URL을 아래 큰따옴표 안에 넣어주세요!
        // =========================================================================
        const GAS_WEB_APP_URL = "여기에_배포한_GAS_웹앱_URL을_입력하세요";

        // 우클릭 및 개발자도구 방지 유지
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => {
            if (e.target.tagName !== 'TEXTAREA') e.preventDefault();
        });
        document.addEventListener('dragstart', e => e.preventDefault());

        const tarotData = [
            { id: 0, title: "0. THE FOOL (광대)", desc: "새로운 시작과 얽매이지 않는 순수함을 상징합니다. 당신의 앞날에 생각지도 못한 즐거운 일탈이 기다리고 있군요!", twist: "예를 들면... 산더미 같은 서류를 뒤로 하고 바닷가로 데이트를 나선 닻과 파도를 목격하는 일 말이죠." },
            { id: 1, title: "I. THE MAGICIAN (마법사)", desc: "무에서 유를 창조하는 의지와 능력입니다. 불가능해 보였던 일들이 당신의 눈앞에서 실현될 수 있습니다.", twist: "분 단위로 짜인 일정을 마법처럼 비워내고, 애송이와 여유로운 티타임을 가지는 닻을 보게 될 겁니다." },
            { id: 2, title: "II. THE HIGH PRIESTESS (여사제)", desc: "뛰어난 직관과 숨겨진 비밀을 의미합니다. 굳이 말하지 않아도 상황의 이면을 꿰뚫어 보게 될 징조입니다.", twist: "무심한 듯 보이는 닻의 시선 끝이 언제나 파란 머리의 보좌관을 향해 있다는 비밀을 당신만 눈치채게 되겠군요." },
            { id: 3, title: "III. THE EMPRESS (여황제)", desc: "풍요와 헌신적인 사랑, 포용력을 뜻합니다. 누군가의 따뜻한 보살핌을 받거나, 평화로운 하루를 보냅니다.", twist: "사르디나의 공기가 유독 포근하네요. 나란히 걸어가는 두 사람의 달콤한 기류를 보며 흐뭇하게 웃을지도 모르죠." },
            { id: 4, title: "IV. THE EMPEROR (황제)", desc: "견고한 권위와 책임감, 흔들리지 않는 기반을 의미합니다. 리더십을 발휘하여 상황을 통제하게 됩니다.", twist: "'오늘은 내 곁에만 머물도록 해. 이건 명령이다.' 라며 사심 가득한 권력을 남용하는 닻을 직관하게 됩니다." },
            { id: 5, title: "V. THE HIEROPHANT (교황)", desc: "전통과 규칙, 그리고 구성원들 간의 암묵적인 동의를 상징합니다. 조언을 구하거나 규칙을 따르는 것이 좋습니다.", twist: "의회당의 암묵적 규칙: '두 사람이 단둘이 있을 땐 집무실 문을 두드리지 말 것.' 오늘 당신은 이 규칙을 뼈저리게 새깁니다." },
            { id: 6, title: "VI. THE LOVERS (연인)", desc: "조화와 결합, 그리고 완벽한 소통을 의미합니다. 오늘은 주변 사람들과 아주 깊고 따뜻한 관계를 맺게 될 운명입니다.", twist: "의회당 뒷편 정원에서 닻과 파도의 애정 어린 시간을 목격하겠군요. 눈치껏 자리를 비켜주는 것이 예의입니다." },

            { id: 14, title: "XIV. TEMPERANCE (절제)", desc: "이질적인 것들의 조화와 화합, 그리고 타협을 의미합니다. 서로 다른 두 요소가 만나 완벽한 혼합물을 이룹니다.", twist: "신중한 닻과 솔직한 파도. 전혀 다를 것 같은 두 사람이 어느덧 서로에게 완벽하게 스며들어 함께하고 있습니다." },

            { id: 17, title: "XVII. THE STAR (별)", desc: "희망과 치유, 그리고 영감을 상징합니다. 어두운 밤하늘을 밝히는 별처럼 긍정적인 에너지가 가득합니다.", twist: "저 멀리서부터 반짝이는 건 서로의 손에 끼워진 반지로군요! 닻과 파도의 앞날이 저 별처럼 눈부십니다." },
            { id: 18, title: "XVIII. THE MOON (달)", desc: "불안과 환상, 숨겨진 두려움을 뜻합니다. 어둠 속에서 진실이 모호하게 보일 수 있습니다.", twist: "악몽에 뒤척이는 파도의 곁을 조용히 지키며, 이불을 덮어주는 닻의 은밀한 다정함을 우연히 목격하고 맙니다." },
            { id: 19, title: "XIX. THE SUN (태양)", desc: "밝은 에너지, 기쁨, 그리고 완벽한 성공을 의미합니다. 그늘 없이 모든 것이 환하게 빛나는 하루입니다.", twist: "해사하게 웃는 파도의 얼굴이 사르디나의 태양보다 밝습니다. 그를 마주하는 닻의 미소는 모든 것을 거머쥔 승리자 같군요." },
            { id: 20, title: "XX. JUDGEMENT (심판)", desc: "부름과 각성, 그리고 부활을 상징합니다. 과거의 짐을 벗어던지고 새로운 단계로 나아갑니다.", twist: "반려를 맞이한 사르디나의 종신 통령이 새로운 내일을 선포합니다. (그리고 오늘은 국경일로 지정됩니다.)" },
            { id: 21, title: "XXI. THE WORLD (세계)", desc: "완성과 통합, 그리고 하나의 주기가 성공적으로 끝남을 의미합니다. 더할 나위 없이 완벽한 상태입니다.", twist: "변치 않고 자리를 지키는 닻과 끊임없이 밀려와 스며드는 파도. 두 사람의 완벽한 세계가 완성되었습니다." }
        ];

        let currentMode = 'daily'; // 'daily' (1장) 또는 'counsel' (3장)
        let canDraw = false;
        let pickedCards = []; // 사용자가 뽑은 카드 데이터 저장 배열

        window.onload = () => {
            shuffleAndSpread();
            fetchVisitorCount();
            window.addEventListener('resize', updateSpreadLayout);
        };

        // 🌐 방문자 카운트 함수 (GAS 연동 + 로컬 백업)
        async function fetchVisitorCount() {
            const countSpan = document.getElementById('visitor-number');
            // 1순위: GAS 웹 앱 URL이 정상 입력되어 있다면 구글 서버에서 카운트
            if (GAS_WEB_APP_URL.startsWith('https://script.google.com')) {
                try {
                    const res = await fetch(GAS_WEB_APP_URL);
                    const data = await res.json();
                    if (data && data.count) {
                        countSpan.innerText = data.count.toLocaleString();
                        return;
                    }
                } catch (e) {
                    console.log('GAS 카운터 연결 대기 중...');
                }
            }
            // 2순위: 아직 GAS를 연결하지 않았을 때 작동하는 백업 카운터
            try {
                const res = await fetch('https://api.counterapi.dev/v1/sardina_destiny/tarot_event/up');
                const data = await res.json();
                countSpan.innerText = data.count ? data.count.toLocaleString() : '특별한';
            } catch (e) {
                countSpan.innerText = '특별한';
            }
        }

        // 🧭 모드 변경 (데일리 1장 <-> 고민 상담 3장)
        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;

            document.getElementById('tab-daily').classList.toggle('active', mode === 'daily');
            document.getElementById('tab-counsel').classList.toggle('active', mode === 'counsel');

            document.getElementById('worry-section').style.display = (mode === 'counsel') ? 'block' : 'none';
            document.getElementById('picked-slots').style.display = (mode === 'counsel') ? 'flex' : 'none';

            shuffleAndSpread();
        }

        // 🎴 피셔-예이츠(Fisher-Yates) 완벽 셔플 알고리즘
        function getShuffledDeck() {
            const arr = [...tarotData];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ✨ 22장 전체 카드를 촤르르륵 펼치는 함수
        function shuffleAndSpread() {
            canDraw = false;
            pickedCards = [];
            resetSlotsUI();
            updateGuideText();

            const deckContainer = document.getElementById('deck');
            deckContainer.innerHTML = ''; // 기존 카드 깨끗이 비우기 (잔상/불일치 원천 차단!)

            const shuffled = getShuffledDeck();

            // 22장 카드 생성 (처음에는 가운데 뭉쳐있음)
            shuffled.forEach((cardData, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                // 카드 요소 자체에 실제 ID를 고정시켜 불일치 버그 완벽 해결!
                cardEl.dataset.cardId = cardData.id;
                cardEl.style.transform = `translateX(0px) translateY(0px) rotate(0deg)`;
                cardEl.style.zIndex = idx + 1;

                cardEl.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <img class="front-img" src="assets/${cardData.id}.jpg" alt="${cardData.title}" onerror="this.style.opacity='0'">
                    </div>
                `;

                cardEl.onclick = () => onCardClick(cardEl, cardData);
                deckContainer.appendChild(cardEl);
            });

            // 촤르르륵! 순차적으로 부채꼴 스프레드 펼치기 애니메이션
            setTimeout(() => {
                updateSpreadLayout(true);
                setTimeout(() => {
                    canDraw = true;
                }, 700);
            }, 150);
        }

        // 화면 크기에 맞춰 22장 부채꼴 위치 계산
        function updateSpreadLayout(animateStagger = false) {
            const cards = document.querySelectorAll('#deck .card');
            const total = cards.length;
            if (total === 0) return;

            const screenWidth = Math.min(window.innerWidth - 40, 800);
            const cardWidth = window.innerWidth <= 600 ? 66 : 90;
            // 22장이 겹쳐서 펼쳐질 간격 계산
            const stepX = (screenWidth - cardWidth) / (total - 1);
            const mid = (total - 1) / 2;

            cards.forEach((cardEl, idx) => {
                const offset = idx - mid;
                const x = offset * stepX;
                const angle = offset * 1.6; // 부채꼴 회전 각도
                const y = Math.abs(offset) * 1.8; // 양끝이 살짝 내려가는 아치 형태

                // 기본 위치 데이터를 저장해둠 (선택 시 위로 올리기 위함)
                cardEl.dataset.baseX = x;
                cardEl.dataset.baseY = y;
                cardEl.dataset.baseAngle = angle;

                const delay = animateStagger ? idx * 22 : 0;
                setTimeout(() => {
                    if (cardEl.classList.contains('is-flipped')) {
                        cardEl.style.transform = `translateX(${x}px) translateY(${y - 25}px) rotateY(180deg)`;
                    } else {
                        cardEl.style.transform = `translateX(${x}px) translateY(${y}px) rotate(${angle}deg)`;
                    }
                }, delay);
            });
        }

        // 👆 카드를 클릭했을 때 실행되는 함수
        function onCardClick(cardEl, cardData) {
            if (!canDraw || cardEl.classList.contains('is-flipped')) return;

            // 3장 고민 상담 모드일 때는 고민을 먼저 적었는지 확인!
            if (currentMode === 'counsel') {
                const worryText = document.getElementById('worry-input').value.trim();
                if (!worryText) {
                    alert('사르디나의 바다에 들려줄 당신의 고민을 먼저 입력해 주세요! 🌊');
                    document.getElementById('worry-input').focus();
                    return;
                }
            }

            // 선택한 카드 뒤집기 연출 (클릭한 카드의 실제 데이터가 100% 그대로 들어감)
            cardEl.classList.add('is-flipped', 'selected-pick');
            const x = parseFloat(cardEl.dataset.baseX || 0);
            const y = parseFloat(cardEl.dataset.baseY || 0);
            cardEl.style.transform = `translateX(${x}px) translateY(${y - 25}px) rotateY(180deg)`;
            cardEl.style.zIndex = 60 + pickedCards.length;

            pickedCards.push(cardData);

            if (currentMode === 'daily') {
                // 🌅 1장 데일리 모드
                canDraw = false;
                setTimeout(() => {
                    showDailyModal(cardData);
                }, 750);
            } else {
                // 🌙 3장 고민 상담 모드
                updateSlotUI(pickedCards.length - 1, cardData);
                updateGuideText();

                if (pickedCards.length === 3) {
                    canDraw = false;
                    setTimeout(() => {
                        showCounselModal(pickedCards);
                    }, 800);
                }
            }
        }

        function updateGuideText() {
            const guide = document.getElementById('pick-guide');
            if (currentMode === 'daily') {
                guide.innerText = '마음이 이끄는 카드 1장을 선택해 주세요 ✨';
            } else {
                const remain = 3 - pickedCards.length;
                if (remain > 0) {
                    const labels = ['첫 번째(과거/원인)', '두 번째(현재/상황)', '세 번째(미래/해답)'];
                    guide.innerText = `고민을 떠올리며 ${labels[pickedCards.length]} 카드를 뽑아주세요 (남은 카드: ${remain}장) 🔮`;
                } else {
                    guide.innerText = '세 장의 운명이 모두 선택되었습니다 ✨';
                }
            }
        }

        function updateSlotUI(slotIdx, cardData) {
            const slot = document.getElementById(`slot-${slotIdx}`);
            if (!slot) return;
            slot.classList.add('filled');
            slot.querySelector('.slot-name').innerText = cardData.title.split('(')[1].replace(')', '');
        }

        function resetSlotsUI() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (slot) {
                    slot.classList.remove('filled');
                    slot.querySelector('.slot-name').innerText = '선택 대기';
                }
            }
        }

        // 🌅 1장 데일리 사르디나 결과 모달 표시
        function showDailyModal(card) {
            document.getElementById('three-cards-view').style.display = 'none';
            document.getElementById('loading-box').style.display = 'none';

            const imgEl = document.getElementById('result-img');
            imgEl.style.display = 'inline-block';
            imgEl.src = `assets/${card.id}.jpg`;

            document.getElementById('card-title').innerText = card.title;
            document.getElementById('card-desc').style.display = 'block';
            document.getElementById('card-desc').innerText = card.desc;

            const twistEl = document.getElementById('card-twist');
            twistEl.style.display = 'block';
            twistEl.innerText = card.twist;

            openModal();
        }

        // 🌙 3장 고민 상담 스프레드 결과 모달 표시 (Gemini API 연동)
        async function showCounselModal(cards) {
            document.getElementById('result-img').style.display = 'none';
            document.getElementById('card-twist').style.display = 'none';
            document.getElementById('three-cards-view').style.display = 'flex';

            // 뽑은 3장의 카드 이미지와 이름 정확히 세팅
            cards.forEach((c, i) => {
                const mImg = document.getElementById(`mini-img-${i}`);
                mImg.style.display = 'block';
                mImg.src = `assets/${c.id}.jpg`;
                document.getElementById(`mini-title-${i}`).innerText = c.title;
            });

            document.getElementById('card-title').innerText = '🌊 사르디나 심해의 타로 리딩';
            document.getElementById('card-desc').style.display = 'none';
            document.getElementById('loading-box').style.display = 'block';

            openModal();

            const worryText = document.getElementById('worry-input').value.trim();

            // GAS 웹 앱으로 Gemini 리딩 요청 보내기
            if (!GAS_WEB_APP_URL.startsWith('https://script.google.com')) {
                document.getElementById('loading-box').style.display = 'none';
                document.getElementById('card-desc').style.display = 'block';
                document.getElementById('card-desc').innerText = 
                    `[안내] 아직 Google Apps Script 웹 앱 URL이 연결되지 않았어요! 😊\n\n` +
                    `뽑으신 카드:\n1) 과거/원인: ${cards[0].title}\n2) 현재/상황: ${cards[1].title}\n3) 미래/해답: ${cards[2].title}\n\n` +
                    `코드 상단의 GAS_WEB_APP_URL에 배포 주소를 입력하시면 제미나이(gemini-3.5-flash-lite)의 실시간 타로 상담 결과가 이곳에 표시됩니다 ✨`;
                return;
            }

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // GAS CORS 에러 방지용 표준 헤더
                    body: JSON.stringify({
                        worry: worryText,
                        cards: cards
                    })
                });

                const data = await response.json();
                document.getElementById('loading-box').style.display = 'none';
                document.getElementById('card-desc').style.display = 'block';

                if (data.status === 'success') {
                    document.getElementById('card-desc').innerText = data.reading;
                } else {
                    document.getElementById('card-desc').innerText = `파도가 잠시 흔들려 응답을 가져오지 못했어요. 다시 시도해 주세요.\n(${data.message})`;
                }
            } catch (error) {
                document.getElementById('loading-box').style.display = 'none';
                document.getElementById('card-desc').style.display = 'block';
                document.getElementById('card-desc').innerText = '서버와 통신 중 오류가 발생했습니다. GAS 웹 앱 배포 권한이 "모든 사용자"로 되어 있는지 확인해 주세요!';
            }
        }

        function openModal() {
            document.getElementById('modal-backdrop').style.display = 'block';
            document.getElementById('result-modal').style.display = 'block';
        }

        function closeAndShuffle() {
            document.getElementById('modal-backdrop').style.display = 'none';
            document.getElementById('result-modal').style.display = 'none';
            shuffleAndSpread();
        }

        // 🚀 트위터 공유 기능 (1장/3장 모드 자동 구분)
        function shareTwitter() {
            let text = '';
            if (currentMode === 'daily' && pickedCards[0]) {
                text = `${pickedCards[0].title}을 뽑았습니다! 나의 운명도 확인해 보세요🔮\nhttps://tarot.sardina.love`;
            } else if (currentMode === 'counsel' && pickedCards.length === 3) {
                const names = pickedCards.map(c => c.title.split('(')[1].replace(')', '')).join(' · ');
                text = `사르디나의 바다에서 [${names}] 세 장의 타로로 고민 상담을 받았습니다🔮\nhttps://tarot.sardina.love`;
            }
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
