const tarotData = [
            // Major Arcana (0 ~ 21)
            { id: 0, title: "0. THE FOOL (광대)", desc: "[키워드: 새로운 시작, 순수한 열정, 자유로운 영혼, 무계획의 모험, 미지의 가능성] 두려움 없이 첫발을 내딛는 순수한 출발의 에너지입니다. 과거의 틀이나 타인의 시선에 얽매이지 않고 백지상태에서 새롭게 시작하는 흐름을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 아무 걱정 없이 해맑고 자유분방해 보이지만, 속으로는 무거운 책임이나 구속에 얽매이는 것을 두려워해 훌쩍 떠나고 싶어 하는 회피 본능과 순수한 갈망이 공존합니다. [상황 및 리딩 가이딩]: 관계에서는 계산 없는 순수한 호감이나 설레는 시작을, 일에서는 기존의 방식을 벗어난 과감한 도전을 의미합니다. 머리로 복잡하게 재기보다 직관과 호기심을 따라 첫발을 내디뎌야 할 때이나, 현실 감각 부족이나 무모함으로 흐르지 않도록 최소한의 안전장치를 살피라고 조언합니다." },
            { id: 1, title: "I. THE MAGICIAN (마법사)", desc: "[키워드: 창조적 실행, 준비된 재능, 탁월한 소통과 설득, 주도권, 자신감] 네 가지 원소를 자유자재로 다루며 무에서 유를 만들어내는 능숙한 실행가의 에너지입니다. 이미 문제를 해결할 능력과 자원이 손안에 갖추어져 있음을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 못 하는 게 없는 유능하고 자신감 넘치는 모습이지만, 내면에는 자신의 빈틈이나 미숙함을 들키지 않으려 끊임없이 상황을 통제하고 증명하려는 긴장감이 숨어 있습니다. [상황 및 리딩 가이딩]: 일과 학업에서는 기획력과 언변이 빛을 발하며, 관계에서는 상대를 끌어당기는 매력과 주도적인 접근을 나타냅니다. 생각을 행동으로 옮기기에 가장 완벽한 타이밍이니 자신의 재능을 믿고 판을 주도하되, 얄팍한 잔꾀나 과장된 포장만 경계하라고 가이딩합니다." },
            { id: 2, title: "II. THE HIGH PRIESTESS (여사제)", desc: "[키워드: 깊은 직관, 내면의 지혜, 감춰진 비밀, 정적인 관조, 신비로운 통찰] 장막 뒤에서 세상의 이치와 무의식을 조용히 꿰뚫어 보는 차분한 통찰의 에너지입니다. 겉으로 드러난 현상보다 숨겨진 이면이나 마음속 깊은 소리가 중요할 때 나옵니다. [심리 양면성(콜드 리딩)]: 겉으로는 차갑고 흔들림 없이 평정심을 유지하지만, 속으로는 누구에게도 쉽게 속내를 털어놓지 못한 채 혼자서만 수많은 감정과 비밀을 삼키고 있는 외로운 신중함이 자리하고 있습니다. [상황 및 리딩 가이딩]: 관계에서는 짝사랑, 말 못 할 비밀, 혹은 서로 간을 보며 정신적인 교감을 나누는 상태를 뜻하고, 일에서는 문서·학업·전문적 분석에 유리합니다. 성급하게 행동하거나 결론을 내리기보다 한 걸음 물러서서 직관을 믿고 상황을 관조하라고 조언합니다." },
            { id: 3, title: "III. THE EMPRESS (여황제)", desc: "[키워드: 풍요와 결실, 다정한 포용력, 감각적 만족, 안정된 매력, 창조적 생산성] 대지의 비옥함 속에서 여유롭게 결실을 누리고 생명을 품어주는 성숙하고 따뜻한 에너지입니다. 물질적·정서적 풍요와 돌봄, 사랑스러움이 극대화되는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 여유롭고 남들을 너그럽게 챙기는 따뜻한 사람이지만, 내면에는 사랑받고 인정받고 싶은 깊은 애정 욕구와 가진 것을 잃기 싫어하는 은근한 소유욕이 함께 자리 잡고 있습니다. [상황 및 리딩 가이딩]: 노력해 온 일이 자연스럽게 열매를 맺고 관계에서는 깊은 애정과 정서적 안정, 화목함이 찾아옵니다. 자신을 아끼고 주변에 다정함을 베풀면 좋으나, 지나친 안일함이나 감정적 과잉보호로 흐르지 않도록 균형을 잡아줍니다." },
            { id: 4, title: "IV. THE EMPEROR (황제)", desc: "[키워드: 확고한 책임감, 질서와 체계, 권위와 통솔력, 흔들리지 않는 기반, 이성적 통제] 단단한 왕좌에 앉아 자신의 영역을 지키고 다스리는 묵직한 리더십의 에너지입니다. 감정적인 동요보다 원칙, 규율, 현실적인 성과와 보호 본능이 우선시되는 상황입니다. [심리 양면성(콜드 리딩)]: 겉으로는 누구에게도 기대지 않는 강인하고 빈틈없는 어른처럼 굴지만, 속으로는 내가 무너지면 모든 것이 무너진다는 무거운 중압감 때문에 약한 모습을 절대 보이지 못하는 고독함이 숨어 있습니다. [상황 및 리딩 가이딩]: 일에서는 목표 달성과 지위 안정을, 관계에서는 든든하고 책임감 있는 태도(혹은 고집스러운 주도권 싸움)를 뜻합니다. 명확한 계획과 자기 통제력으로 밀고 나가되, 독단적인 고집으로 자신과 주변을 옥죄지 않도록 유연함을 권합니다." },
            { id: 5, title: "V. THE HIEROPHANT (교황)", desc: "[키워드: 전통과 규범, 멘토의 조언, 깊은 신뢰, 배움과 교육, 검증된 정공법] 오랜 세월 검증된 지혜를 전달하고 도덕적·사회적 질서를 수호하는 정신적 스승의 에너지입니다. 제도권의 도움, 학업, 조언자, 혹은 진지하고 예의 바른 관계를 암시합니다. [심리 양면성(콜드 리딩)]: 겉으로는 바르고 모범적이며 타인의 기대에 잘 부응하는 모습이지만, 내면에는 '좋은 사람'이라는 틀에서 벗어나는 것에 대한 두려움과 남들의 시선을 의식하는 답답함이 눌려 있습니다. [상황 및 리딩 가이딩]: 파격적인 모험이나 편법보다는 검증된 정공법을 따르는 것이 가장 안전합니다. 경험 많은 연장자나 전문가의 조언을 구하면 큰 도움이 되며, 고정관념에 지나치게 갇히지만 않도록 안내합니다." },
            { id: 6, title: "VI. THE LOVERS (연인)", desc: "[키워드: 깊은 교감, 강렬한 끌림, 조화로운 파트너십, 가치관의 선택, 솔직한 진심] 서로의 눈을 마주 보며 진심을 확인하는 강한 인력의 에너지이자, 인생의 중요한 갈림길에 선 선택의 에너지입니다. 관계의 급진전이나 마음이 시키는 결단을 의미합니다. [심리 양면성(콜드 리딩)]: 겉으로는 다정하고 사람들과 조화롭게 어울리지만, 속으로는 두 가지 매력적인 선택지나 감정 사이에서 어느 한쪽도 쉽게 포기하지 못해 갈팡질팡하는 흔들림이 공존합니다. [상황 및 리딩 가이딩]: 연애와 대인관계에서는 최고의 호흡과 설렘, 시너지를 뜻하며 일에서도 마음이 잘 맞는 파트너를 만납니다. 손익 계산보다 마음이 진정으로 원하는 가치를 선택하되, 순간의 유혹이나 우유부단함으로 책임을 미루지 말라고 조언합니다." },
            { id: 7, title: "VII. THE CHARIOT (전차)", desc: "[키워드: 강력한 추진력, 정면 돌파, 속도전, 목표 달성, 상반된 힘의 통제] 서로 다른 방향을 보려는 두 스핑크스의 고삐를 단단히 쥐고 목표를 향해 거침없이 질주하는 승리의 에너지입니다. 장애물을 정면으로 뚫고 나가 결과를 거머쥐는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 거침없고 자신만만하게 앞만 보고 달리는 듯하지만, 속으로는 멈추는 순간 불안과 두려움에 삼켜질까 봐 스스로를 채찍질하며 조급하게 몰아붙이는 긴장이 깔려 있습니다. [상황 및 리딩 가이딩]: 단기 목표 달성, 시험 합격, 경쟁 우위, 적극적인 대시에 매우 유리합니다. 망설이지 말고 강한 의지와 집중력으로 밀어붙여야 할 때이나, 주변의 속도를 무시한 폭주나 과도한 승부욕으로 인한 번아웃은 주의하라고 가이딩합니다." },
            { id: 8, title: "VIII. STRENGTH (힘)", desc: "[키워드: 외유내강, 부드러운 카리스마, 인내와 포용, 내면의 용기, 감정의 조련] 사나운 사자를 무력이 아닌 따스한 손길과 침착함으로 길들이는 성숙한 내공의 에너지입니다. 강압적으로 꺾기보다 인내와 공감으로 까다로운 상황이나 감정을 다스리는 상태를 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 온화하고 모든 것을 다 이해해 주는 여유로운 모습이지만, 내면에는 솟구치는 답답함이나 본능적인 감정을 꾹꾹 눌러 참으며 혼자 감내하고 있는 묵직한 피로가 쌓여 있습니다. [상황 및 리딩 가이딩]: 쉽지 않은 상대나 난관을 마주하더라도 당신 안에는 이를 감당할 충분한 저력이 있습니다. 억지로 밀어붙이지 말고 부드러운 태도와 끈기로 천천히 신뢰를 쌓아가면 결국 판을 당신의 흐름으로 길들이게 됩니다." },
            { id: 9, title: "IX. THE HERMIT (은둔자)", desc: "[키워드: 깊은 성찰, 고독한 탐구, 내면의 등불, 신중한 거리두기, 본질 찾기] 세상의 소음에서 한 걸음 물러나 고요 속에서 스스로 등불을 밝히고 진짜 해답을 찾는 현자의 에너지입니다. 외적인 확장이나 사교보다 내면의 정리와 깊이 있는 탐구가 필요한 시기입니다. [심리 양면성(콜드 리딩)]: 겉으로는 혼자 있는 것을 즐기고 초연해 보이지만, 속으로는 상처받거나 실망하는 것이 두려워 스스로 마음의 문을 걸어 잠그고 외로움 속에 숨어드는 방어기제가 작동하고 있습니다. [상황 및 리딩 가이딩]: 주변의 말에 휩쓸리지 말고 잠시 혼자만의 시간을 가지며 문제를 근본부터 돌아봐야 합니다. 속도는 더뎌 보일지라도 지금의 숙고와 신중함이 가장 정확한 해답을 찾아줄 것이니 조급해하지 말라고 다독입니다." },
            { id: 10, title: "X. WHEEL OF FORTUNE (운명의 수레바퀴)", desc: "[키워드: 운명적 전환점, 거스를 수 없는 흐름, 새로운 기회와 타이밍, 순환, 필연적 인연] 거대한 바퀴가 맞물려 돌아가며 멈춰 있던 상황이 움직이고 새로운 국면이 열리는 변화의 에너지입니다. 뜻밖의 기회, 재회, 환경의 전환을 맞이함을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 흘러가는 상황에 순응하며 담담한 척하지만, 내면에는 내 뜻대로 통제할 수 없는 변수와 불확실한 미래 앞에서 운에 기대어 보고 싶은 초조함과 설렘이 교차하고 있습니다. [상황 및 리딩 가이딩]: 억지로 흐름을 거스르려 애쓰기보다 찾아온 변화의 물결에 유연하게 몸을 실어야 할 때입니다. 답답했던 정체기는 지나가고 새로운 기회가 돌아오고 있으니, 타이밍을 놓치지 말고 열린 마음으로 붙잡으라고 안내합니다." },
            { id: 11, title: "XI. JUSTICE (정의)", desc: "[키워드: 공정한 판단, 냉철한 균형, 인과응보, 이성적 결단, 명확한 계약과 선 긋기] 한 손에는 칼, 한 손에는 저울을 들고 치우침 없이 진실과 손익을 가려내는 이성의 에너지입니다. 뿌린 대로 거두는 정직한 결과와 합리적인 조율을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 감정에 휘둘리지 않고 공평하고 이성적으로 따지는 듯하지만, 속으로는 내가 손해 보거나 부당한 대우를 받을까 봐 본능적으로 마음의 저울질을 멈추지 못하는 방어 심리가 자리 잡고 있습니다. [상황 및 리딩 가이딩]: 인정에 끌려다니지 말고 객관적인 사실과 기준에 따라 명확하게 결단해야 합니다. 노력한 만큼 정당한 평가를 받게 되며, 관계나 일에서도 서로에게 공평한 선과 예의를 지키는 것이 해결책임을 짚어줍니다." },
            { id: 12, title: "XII. THE HANGED MAN (매달린 사람)", desc: "[키워드: 관점의 전환, 자발적 인내, 일시 정지, 더 큰 가치를 위한 감수, 역발상] 거꾸로 매달려 움직일 수 없는 상태지만 얼굴에는 평온한 깨달음의 빛이 감도는 역설적인 에너지입니다. 표면적으로는 정체되어 답답해 보이나 내적으로는 세상을 보는 시야가 완전히 달라지는 시간입니다. [심리 양면성(콜드 리딩)]: 겉으로는 상황을 받아들이고 묵묵히 참고 있는 것처럼 보이지만, 속으로는 이러지도 저러지도 못하는 교착 상태에 지쳐 누군가 이 구속을 끊어주길 바라는 답답함과 체념이 뒤섞여 있습니다. [상황 및 리딩 가이딩]: 지금은 억지로 몸부림쳐도 상황이 바뀌지 않으니 차라리 멈춤을 인정하고 문제를 완전히 다른 각도에서 바라봐야 합니다. 당장의 기다림이나 양보가 결국 더 깊은 지혜와 판을 뒤집는 밑거름이 된다고 위로합니다." },
            { id: 13, title: "XIII. DEATH (죽음)", desc: "[키워드: 완전한 종결, 필연적 탈바꿈, 낡은 것의 청산, 새로운 시작을 위한 비움] 한 시대가 완전히 막을 내리고 저 멀리 여명이 밝아오는 강렬한 전환의 에너지입니다. 이미 수명이 다한 관계, 미련, 방식, 습관을 끝내야만 비로소 새로운 생명이 움틈을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 차갑게 마음을 정리하거나 단호하게 선을 긋는 듯하지만, 내면에는 익숙한 것을 잃는 상실의 아픔과 끝내 놓지 못한 미련이 날카롭게 부딪히며 몸살을 앓고 있습니다. [상황 및 리딩 가이딩]: 끝나는 것을 두려워하거나 죽은 불씨를 붙잡고 늘어지지 말고 과감하게 매듭을 지어야 합니다.(관계 서사에서는 이전과는 완전히 달라지는 치명적인 전환점이나 피폐한 애증의 재탄생을 뜻하기도 합니다.) 이 단절은 파괴가 아니라 새 출발을 위한 필수적인 정화 과정임을 전달합니다." },
            { id: 14, title: "XIV. TEMPERANCE (절제)", desc: "[키워드: 조화와 균형, 중용의 미덕, 유연한 조율, 점진적 치유, 차분한 소통] 두 잔의 물을 한 방울도 흘리지 않고 정교하게 섞어 새로운 온도를 만들어내는 평온하고 치유적인 에너지입니다. 극단을 피하고 서로 다른 입장이나 감정을 부드럽게 융합하는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 둥글고 평온하게 모든 갈등을 잘 중재하는 모습이지만, 속으로는 내 진짜 감정을 폭발시키지 않으려 애써 수위를 조절하며 맞춰주느라 은근한 감정 소모를 겪고 있습니다. [상황 및 리딩 가이딩]: 조급하게 결론을 내거나 무리하지 말고 삶의 리듬과 마음의 평정심을 되찾아야 합니다. 대화와 타협을 통해 날 선 갈등이 스르르 풀리며, 조금씩 꾸준히 호흡을 맞춰가는 태도가 가장 확실한 안정을 가져온다고 조언합니다." },
            { id: 15, title: "XV. THE DEVIL (악마)", desc: "[키워드: 강렬한 집착, 치명적인 유혹, 끊어내기 힘든 굴레, 본능적 욕망, 구속과 애증] 느슨한 사슬에 묶인 채 스스로 벗어나지 않고 달콤한 쾌락이나 두려움에 머무는 그림자 에너지입니다. 중독적인 관계, 강한 독점욕, 과도한 물욕, 혹은 부정적인 생각의 감옥을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 이 상황이나 관계가 힘들다고 투덜대거나 외면하려 하지만, 속으로는 그 자극과 집착이 주는 달콤함에 깊이 길들여져 스스로도 그 사슬을 놓기 싫어하는 은밀한 욕망이 도사리고 있습니다. [상황 및 리딩 가이딩]: 현실 상담에서는 무엇이 나를 옭아매고 있는지 직시하고 내 의지로 언제든 사슬을 벗어던질 수 있음을 일깨워 주며, 캐릭터 페어나 관계 서사에서는 서로를 망가뜨리면서도 절대 놓지 못하는 지독한 애증과 관능적인 구속, 집착의 텐션으로 생생하게 풀어냅니다." },
            { id: 16, title: "XVI. THE TOWER (탑)", desc: "[키워드: 갑작스러운 충격, 거짓된 틀의 붕괴, 강렬한 각성, 예상치 못한 변수, 근본적인 재건] 마른하늘에 날벼락을 맞아 높이 쌓아 올린 탑이 무너져 내리는 극적인 충격과 해방의 에너지입니다. 억지로 유지하던 불안정한 기반이나 가식이 한순간에 깨지며 민낯의 진실이 드러남을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 아무 문제 없는 척 견고한 성벽을 쌓고 버텨왔지만, 속으로는 언젠가 이 아슬아슬한 균형이 깨질지 모른다는 위태로움을 예감하며 오히려 한 번쯤 시원하게 무너져 내리길 바랐던 숨 막힘이 있습니다. [상황 및 리딩 가이딩]: 예상치 못한 변수나 갈등, 진실의 폭로가 터질 수 있지만 이는 곪아 있던 상처가 터져 나오는 치유의 과정입니다. 무너진 것에 절망하기보다 거짓된 틀을 걷어내고 바닥부터 더 단단하고 진실된 토대를 다시 쌓을 기회로 삼으라고 가이딩합니다." },
            { id: 17, title: "XVII. THE STAR (별)", desc: "[키워드: 맑은 희망, 영감과 치유, 순수한 소망, 정서적 평온, 동경과 긍정적 전망] 거센 폭풍우가 지나간 밤하늘에서 가장 맑게 빛나는 길잡이 별의 에너지입니다. 상처받은 마음이 고요히 아물고 미래에 대한 투명한 비전과 믿음, 설렘이 다시 피어오르는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 밝고 긍정적이며 이상적인 꿈을 이야기하지만, 내면에는 지난 상처의 여운이 아직 가시지 않아 행여나 이 희망마저 부서질까 봐 조심스럽게 마음을 어루만지는 여린 감수성이 숨어 있습니다. [상황 및 리딩 가이딩]: 긴 어둠 끝에서 빛이 보이기 시작하니 희망을 잃지 말아야 합니다. 당장 눈앞의 계산적인 실익보다도 마음이 정화되고 진심으로 바라는 꿈과 인연을 향해 나아가는 순수한 믿음이 결국 가장 아름다운 결과를 불러온다고 응원합니다." },
            { id: 18, title: "XVIII. THE MOON (달)", desc: "[키워드: 불확실성, 막연한 불안과 의심, 달콤한 환상과 오해, 감춰진 이면, 감정의 동요] 안개 낀 밤길처럼 앞이 뚜렷이 보이지 않아 두려움과 상상이 꼬리를 무는 아련하고도 불안정한 에너지입니다. 실체 없는 걱정, 오해, 혹은 아직 수면 위로 드러나지 않은 비밀과 복잡한 속내를 암시합니다. [심리 양면성(콜드 리딩)]: 겉으로는 침착하게 상황을 지켜보는 척하지만, 속으로는 확인되지 않은 상대의 태도나 미래에 대해 온갖 부정적인 시나리오를 쓰며 밤마다 감정의 파도에 휩쓸리는 깊은 불안이 자리하고 있습니다. [상황 및 리딩 가이딩]: 시야가 흐려 의심과 걱정이 부풀려지기 쉽지만 상당수는 내 마음이 만들어낸 그림자일 수 있습니다. 안개가 걷히고 명확한 진실이 드러날 때까지 섣부른 추측이나 감정적인 추궁, 중대한 결정을 미루고 마음을 다잡으라고 조언합니다." },
            { id: 19, title: "XIX. THE SUN (태양)", desc: "[키워드: 눈부신 성공, 명쾌한 해결, 넘치는 생명력, 순수한 기쁨, 축복과 당당함] 구름 한 점 없는 하늘에 태양이 떠올라 모든 그늘과 의심, 오해를 말끔히 걷어내는 최고의 긍정 에너지입니다. 일의 확실한 성취, 관계의 화목과 투명한 진심, 활력의 회복을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 구김살 없이 밝고 당당하게 빛나는 모습이지만, 내면에는 어두운 그늘이나 우울함을 마주하기 싫어 늘 밝고 완벽한 모습만 보여주려 애쓰는 순수한 인정 욕구가 함께 비칩니다. [상황 및 리딩 가이딩]: 골치 아팠던 문제가 명쾌하게 풀리고 노력에 대한 가장 밝은 결실을 보게 됩니다. 숨기거나 주저할 필요 없이 당당하게 자신의 마음과 실력을 드러내고, 찾아온 행운과 따뜻한 기쁨을 온전히 만끽하라고 축하를 건넵니다." },
            { id: 20, title: "XX. JUDGEMENT (심판)", desc: "[키워드: 부활과 재기, 중대한 결단, 기다리던 소식과 부름, 과거의 결산, 극적인 각성] 천사의 나팔 소리에 잠들었던 영혼들이 깨어나 새로운 삶으로 부름받는 거대한 각성과 부활의 에너지입니다. 잊고 있던 기회의 재등장, 재회, 혹은 그동안의 노력에 대한 최종 결과 발표를 의미합니다. [심리 양면성(콜드 리딩)]: 겉으로는 이미 지나간 일이라며 담담하게 덮어둔 척하지만, 속으로는 언젠가 그 인연이나 기회가 다시 나를 불러주길 간절히 기다리며 과거의 미련을 완전히 매듭짓지 못한 마음이 남아 있습니다. [상황 및 리딩 가이딩]: 과거의 경험과 노력이 헛되지 않고 결정적인 전환점으로 되돌아옵니다. 피하거나 미루지 말고 진실한 마음으로 결단을 내릴 때이며, 오래 기다려온 연락이나 두 번째 기회를 기꺼이 맞이하라고 안내합니다." },
            { id: 21, title: "XXI. THE WORLD (세계)", desc: "[키워드: 완벽한 완성, 해피엔딩, 조화로운 통합, 목표의 최종 달성, 더 넓은 세계로의 도약] 긴 여정의 마침표를 찍고 월계관 속에서 자유롭게 춤추는 궁극적인 성취와 완성의 에너지입니다. 하나의 프로젝트나 관계, 삶의 중요한 챕터가 성공적이고 만족스럽게 마무리됨을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 모든 것을 이뤄내어 안정되고 부족함이 없어 보이지만, 내면에는 하나의 챕터가 끝난 뒤 찾아오는 미묘한 허탈감과 이제 또 어디로 나아가야 할지 고민하는 새로운 갈증이 피어오르고 있습니다. [상황 및 리딩 가이딩]: 그동안의 수고가 온전한 결실을 맺고 가장 이상적인 조화에 이릅니다. 지금의 성취와 평화를 충분히 자축하고, 이 단단한 완성을 발판 삼아 한 단계 더 넓은 세상과 다음 챕터로 당당히 나아가라고 축복합니다." },

            // Minor Arcana - Wands (W1 ~ W14) : 열정, 행동, 일, 의지 (불의 원소)
            { id: "W1", title: "ACE OF WANDS (완드 에이스)", desc: "[키워드: 점화된 열정, 강렬한 첫 불씨, 새로운 기회, 강한 동기부여, 본능적 끌림] 허공에서 뻗어 나온 손이 싹이 트는 지팡이를 힘차게 쥐고 있는 폭발적인 출발의 에너지입니다. 가슴을 뛰게 하는 새로운 아이디어나 일, 강렬한 호감의 불씨가 켜졌음을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 의욕이 넘치고 당장이라도 무언가를 해낼 듯 뜨겁지만, 속으로는 이 열기가 금방 식어버리거나 뒷심이 부족할까 봐 조바심을 내는 마음이 숨어 있습니다. [상황 및 리딩 가이딩]: 머뭇거릴 틈이 없습니다. 지금 떠오른 영감이나 찾아온 기회를 즉시 붙잡고 행동에 옮기면 엄청난 추진력을 얻게 된다고 격려합니다." },
            { id: "W2", title: "TWO OF WANDS (완드 2)", desc: "[키워드: 미래 설계, 더 큰 야망, 방향 설정, 출발 전의 조망, 선택의 기로] 성벽 위에서 지구본을 들고 저 넓은 바다 너머를 내다보는 전략가의 에너지입니다. 어느 정도 기본적인 성취를 이룬 상태에서 더 넓은 세상으로 나아갈 다음 스텝을 구상하는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 여유롭게 미래를 계획하는 야심가처럼 보이지만, 속으로는 익숙하고 안전한 현재의 울타리를 벗어나 미지의 바다로 직접 뛰어드는 것을 망설이는 두려움이 공존합니다. [상황 및 리딩 가이딩]: 현재의 안전지대에만 머물지 말고 장기적인 비전과 구체적인 계획을 세워야 할 때입니다. 철저한 사전 준비와 넓은 시야가 성공적인 확장을 이끌어 줍니다." },
            { id: "W3", title: "THREE OF WANDS (완드 3)", desc: "[키워드: 순조로운 확장, 첫 성과의 가시화, 더 넓은 무대, 미래 지향적 기다림] 이미 배를 바다로 띄워 보내고 언덕 위에서 돌아올 결실과 수평선 너머를 바라보는 진취적인 에너지입니다. 시작한 일이 순조롭게 궤도에 올라 바깥으로 뻗어 나가는 시기입니다. [심리 양면성(콜드 리딩)]: 겉으로는 확신에 차서 결과를 기다리는 듯하지만, 내면에는 내가 띄워 보낸 진심이나 노력이 과연 기대만큼의 보답으로 돌아올지 초조하게 수평선을 살피는 기다림이 있습니다. [상황 및 리딩 가이딩]: 당신의 선택과 노력이 올바른 해류를 타고 순항하고 있습니다. 시야를 넓혀 외부와의 협력이나 새로운 무대로의 확장을 적극적으로 모색하라고 조언합니다." },
            { id: "W4", title: "FOUR OF WANDS (완드 4)", desc: "[키워드: 안정된 기쁨, 축하와 환영, 평화로운 안식처, 1차 목표 달성, 화목한 유대] 꽃으로 장식된 기둥 아래에서 사람들이 기쁘게 축제를 벌이는 따뜻하고 안정적인 에너지입니다. 노력 끝에 찾아온 달콤한 휴식, 합격, 정착, 혹은 관계의 편안한 안정을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 사람들과 어울려 밝게 웃고 평온을 누리지만, 속으로는 이 아늑한 평화가 깨질까 봐 다음 단계의 도전을 미루고 현재의 편안함에 안주하고 싶어 하는 마음이 엿보입니다. [상황 및 리딩 가이딩]: 지금껏 일궈낸 성과를 소중한 사람들과 나누며 마음 편히 기쁨을 누려도 좋은 시기입니다. 든든한 울타리 안에서 에너지를 충분히 재충전하라고 전합니다." },
            { id: "W5", title: "FIVE OF WANDS (완드 5)", desc: "[키워드: 치열한 경쟁, 의견 충돌, 혼란스러운 조율, 양보 없는 신경전, 역동적 자극] 다섯 사람이 각자의 지팡이를 휘두르며 뒤엉켜 자기주장을 펼치는 어수선하지만 활기찬 에너지입니다. 여러 사람의 이해관계가 부딪히거나 내면의 생각들이 복잡하게 싸우는 상태입니다. [심리 양면성(콜드 리딩)]: 겉으로는 지지 않으려 목소리를 높이고 팽팽하게 맞서지만, 속으로는 내 존재감과 가치를 인정받고 싶어서 안간힘을 쓰는 조급함과 피로가 엉켜 있습니다. [상황 및 리딩 가이딩]: 크고 작은 마찰이나 경쟁이 불가피하지만 이는 치명적인 파국이 아니라 조율을 위한 진통입니다. 기죽지 말고 자신의 입장을 조리 있게 관철하되 소모적인 감정싸움은 피하라고 조언합니다." },
            { id: "W6", title: "SIX OF WANDS (완드 6)", desc: "[키워드: 당당한 승리, 대중의 인정과 찬사, 자부심, 성공적인 귀환, 주도권 확보] 월계관을 쓰고 사람들의 환호를 받으며 행진하는 승리의 에너지입니다. 치열한 과정을 거쳐 능력을 공식적으로 인정받고 명예와 자신감을 얻는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 당당하고 의기양양한 승자의 모습이지만, 내면에는 타인의 박수와 시선으로만 내 가치를 확인하려 하거나 이 자리에서 내려오게 될까 봐 긴장하는 부담감이 숨어 있습니다. [상황 및 리딩 가이딩]: 스스로를 믿고 당당하게 나서면 좋은 평가와 성취가 따릅니다. 자신감을 마음껏 누리되, 승리에 취해 자만하거나 주변 사람의 배려를 당연하게 여기지 않도록만 주의하면 완벽합니다." },
            { id: "W7", title: "SEVEN OF WANDS (완드 7)", desc: "[키워드: 고군분투, 입지 수성, 물러서지 않는 용기, 치열한 방어전, 신념 고수] 아래에서 치고 올라오는 도전을 높은 위치에서 홀로 막아내는 결연한 에너지입니다. 만만치 않은 압박이나 주변의 간섭 속에서도 내가 가진 유리한 고지와 자존심을 지켜내야 하는 상황입니다. [심리 양면성(콜드 리딩)]: 겉으로는 결연하고 강단 있게 맞서 싸우는 듯하지만, 속으로는 사방에서 몰려오는 요구와 시선을 혼자 감당하느라 잔뜩 날이 서 있고 지쳐 있는 방어적인 심리가 읽힙니다. [상황 및 리딩 가이딩]: 벅차 보이더라도 지금 당신이 더 유리한 고지에 서 있습니다. 타협하거나 쉽게 물러서지 말고 끝까지 자신의 신념과 자리를 굳건히 지키면 결국 승기를 잡게 됩니다." },
            { id: "W8", title: "EIGHT OF WANDS (완드 8)", desc: "[키워드: 초고속 전개, 반가운 소식과 연락, 거침없는 흐름, 급진전, 타이밍] 여덟 개의 지팡이가 허공을 가르며 목표 지점을 향해 일제히 날아가는 빠른 속도의 에너지입니다. 지체되던 일들이 한꺼번에 풀리거나 급작스러운 연락, 감정의 급진전이 일어남을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 거침없이 빠르게 상황을 추진하는 듯하지만, 속으로는 기다리는 시간을 견디지 못해 빨리 결론을 확인하고 싶어 하는 성급함과 조바심이 강하게 작용하고 있습니다. [상황 및 리딩 가이딩]: 상황이 매우 빠르게 돌아가니 망설이지 말고 흐름에 맞춰 기민하게 움직여야 합니다. 곧 기다리던 소식이나 확실한 진전이 눈앞에 도착할 것입니다." },
            { id: "W9", title: "NINE OF WANDS (완드 9)", desc: "[키워드: 마지막 고비, 끈질긴 인내, 높은 경계심, 상처 입은 투혼, 포기하지 않는 의지] 지난 싸움의 상처를 안은 채 지팡이를 짚고 서서 끝까지 방어 태세를 늦추지 않는 지친 전사의 에너지입니다. 오랜 시련으로 피로가 누적되었지만 완주까지 단 한 걸음만 남은 상태입니다. [심리 양면성(콜드 리딩)]: 겉으로는 누구의 도움도 거절하며 꿋꿋이 버티고 서 있지만, 내면에는 과거에 입은 상처가 다시 반복될까 봐 아무도 쉽게 믿지 못하고 벽을 치는 아픈 경계심이 자리하고 있습니다. [상황 및 리딩 가이딩]: 많이 지치고 경계심이 커졌겠지만 여기서 포기하기엔 그동안 버텨온 시간이 너무 아깝습니다. 마지막 고비만 넘기면 되니 스스로를 다독이며 조금만 더 힘을 내어 마무리를 지키라고 따스하게 격려합니다." },
            { id: "W10", title: "TEN OF WANDS (완드 10)", desc: "[키워드: 과부하, 무거운 책임감, 혼자 짊어진 독박, 번아웃 위기, 내려놓음의 필요성] 앞이 보이지 않을 정도로 열 개의 지팡이를 혼자 힘겹게 끌어안고 걸어가는 과중한 부담의 에너지입니다. 책임감이 너무 강하거나 거절을 못 해 감당하기 벅찬 일과 감정까지 모두 짊어진 모습입니다. [심리 양면성(콜드 리딩)]: 겉으로는 묵묵히 모든 책임을 다하는 성실하고 강한 사람처럼 보이지만, 속으로는 '내가 아니면 안 된다'는 강박과 아무도 내 무거운 짐을 알아주지 않는다는 서러움에 숨이 턱 끝까지 차올라 있습니다. [상황 및 리딩 가이딩]: 목표가 멀지 않았지만 지금 방식으로는 마음이 먼저 무너질 수 있습니다. 모든 것을 혼자 완벽하게 해내려 하지 말고, 불필요한 짐과 타인의 몫은 과감히 덜어내라고 조언합니다." },
            { id: "W11", title: "PAGE OF WANDS (완드 페이지)", desc: "[키워드: 순수한 호기심, 설레는 출발, 반가운 소식, 꾸밈없는 열망, 가능성의 탐색] 지팡이를 들고 눈을 반짝이며 새로운 세상을 탐색하는 소년의 에너지입니다. 아직 경험은 부족하지만 배움의 열정과 가능성이 가득한 시작 단계나 기분 좋은 연락을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 새롭고 재미있는 일에 눈을 반짝이며 들떠 있지만, 속으로는 아직 확고한 기반이나 자신이 없어 작은 난관에도 쉽게 흔들리는 여리고 미숙한 마음이 공존합니다. [상황 및 리딩 가이딩]: 처음 해보는 일이나 새로운 관계에 설레는 마음으로 가볍게 도전해 보기 좋습니다. 결과의 크기보다 시작하는 즐거움과 가능성에 집중하라고 안내합니다." },
            { id: "W12", title: "KNIGHT OF WANDS (완드 나이트)", desc: "[키워드: 거침없는 돌진, 뜨거운 행동력, 모험심, 직진 본능, 급한 열기] 앞발을 번쩍 든 말을 타고 사막을 질주하는 열혈 기사의 에너지입니다. 생각이 떠오르면 곧바로 실행에 옮기는 강력한 추진력과 환경의 이동, 솔직하고 뜨거운 직진을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 두려움 없이 돌진하는 화끈한 행동파지만, 내면에는 지루함이나 구속을 견디지 못하고 디테일한 뒷수습보다 당장의 자극과 속도에만 매달리는 조급함이 숨어 있습니다. [상황 및 리딩 가이딩]: 주저하던 일을 단숨에 밀어붙이는 대담함이 빛을 발합니다. 다만 앞뒤 재지 않는 성급함이나 금방 타오르고 식는 감정 기복만 조절하면 큰 성과를 냅니다." },
            { id: "W13", title: "QUEEN OF WANDS (완드 퀸)", desc: "[키워드: 당당한 매력, 따뜻한 리더십, 자기확신, 외향적 활력, 주체적인 태도] 해바라기와 검은 고양이를 곁에 두고 밝고 기품 있게 앉아 있는 여왕의 에너지입니다. 독립적이면서도 주변 사람들에게 활기와 영감을 불어넣는 매력적이고 주도적인 상태를 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 언제나 밝고 당당하며 자존감이 높아 보이지만, 속으로는 주인공 자리에서 밀려나거나 자존심에 스크래치가 나는 것을 누구보다 싫어하는 강한 자존심이 자리하고 있습니다. [상황 및 리딩 가이딩]: 주눅 들지 말고 자신의 매력과 능력을 당당하게 표현하세요. 긍정적이고 주체적인 태도가 사람들을 자연스럽게 끌어당기고 상황을 당신 편으로 만듭니다." },
            { id: "W14", title: "KING OF WANDS (완드 킹)", desc: "[키워드: 원대한 비전, 결단력 있는 통솔, 노련한 추진력, 카리스마, 큰 그림] 뜨거운 열정을 노련한 지혜로 다스리며 전체 판을 이끄는 왕의 에너지입니다. 단순한 실무를 넘어 방향성을 제시하고 책임을 지는 강력한 리더십과 자신감을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 호탕하고 믿음직스럽게 모두를 이끄는 리더지만, 내면에는 내 방식과 비전이 무조건 옳다고 믿어 타인의 세밀한 감정을 놓치거나 통제하려 드는 조급함이 함께 있습니다. [상황 및 리딩 가이딩]: 사소한 것에 일희일비하지 말고 대범하고 주체적으로 결단을 내려야 합니다. 당신의 확신에 찬 태도와 결단력이 문제 해결의 가장 확실한 열쇠가 됩니다." },

            // Minor Arcana - Cups (C1 ~ C14) : 감정, 사랑, 관계, 내면 (물의 원소)
            { id: "C1", title: "ACE OF CUPS (컵 에이스)", desc: "[키워드: 감정의 충만함, 새로운 사랑과 호감, 정서적 치유, 순수한 기쁨, 영감의 샘] 성배에서 맑은 물이 다섯 줄기로 넘쳐흐르며 연꽃을 피워내는 축복의 에너지입니다. 마음이 따뜻하게 채워지는 새로운 인연, 깊은 공감, 정서적 만족의 시작을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 다정하고 감수성이 풍부해 보이지만, 속으로는 감정적인 결핍을 채우고 싶어 누군가의 온기와 무조건적인 수용을 간절히 갈망하는 여린 마음이 자리하고 있습니다. [상황 및 리딩 가이딩]: 마음을 활짝 열고 찾아오는 다정한 감정과 호의를 기쁘게 받아들이세요. 인간관계의 화해나 새로운 설렘, 마음을 적시는 위로가 찾아오는 시기입니다." },
            { id: "C2", title: "TWO OF CUPS (컵 2)", desc: "[키워드: 깊은 상호 교감, 진실한 파트너십, 화해와 결합, 마음이 통하는 인연, 대등한 존중] 두 사람이 마주 서서 서로의 잔을 나누며 깊은 신뢰와 애정을 확인하는 조화의 에너지입니다. 일방적이지 않은 쌍방의 호감, 좋은 동료, 성공적인 약속과 계약을 의미합니다. [심리 양면성(콜드 리딩)]: 겉으로는 상대와 다정하게 호흡을 맞추고 있지만, 내면에는 내가 주는 마음만큼 상대도 나를 똑같이 특별하게 여겨주길 바라는 확인 욕구와 관계에 대한 깊은 의존성이 숨어 있습니다. [상황 및 리딩 가이딩]: 상대방과 마음이 깊이 통하고 서로에게 큰 힘이 되어주는 흐름입니다. 솔직한 대화와 존중을 통해 관계가 한층 더 단단하고 각별하게 발전할 것입니다." },
            { id: "C3", title: "THREE OF CUPS (컵 3)", desc: "[키워드: 함께 나누는 기쁨, 즐거운 모임과 우정, 축하할 소식, 경쾌한 소통, 감정적 유대] 세 사람이 잔을 높이 들고 춤추며 수확의 기쁨을 만끽하는 밝고 사교적인 에너지입니다. 좋은 소식을 주변과 나누거나 마음이 맞는 사람들과 즐겁게 어울리는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 사람들과 어울려 유쾌하게 웃고 떠들지만, 속으로는 혼자 남겨지는 외로움이 싫어 분위기나 타인의 기분에 과하게 맞추거나 깊은 진지함을 피하려는 마음이 비칩니다. [상황 및 리딩 가이딩]: 혼자 고민을 껴안고 있기보다 사람들과 어울리며 밝은 에너지를 나누세요. 다만 관계에서 분위기에 휩쓸리거나 감정이 여럿 사이에서 복잡하게 얽히는 것만 가볍게 주의하면 좋습니다." },
            { id: "C4", title: "FOUR OF CUPS (컵 4)", desc: "[키워드: 권태감과 무료함, 심드렁한 방어, 눈앞의 기회 외면, 내면으로의 침잠, 의욕 저하] 나무 아래 팔짱을 끼고 앉아 눈앞에 놓인 세 개의 잔도, 허공에서 건네지는 새로운 잔도 시큰둥하게 외면하는 에너지입니다. 반복되는 일상에 지루함을 느끼거나 실망하기 싫어 마음을 닫아건 상태입니다. [심리 양면성(콜드 리딩)]: 겉으로는 아무것에도 관심이 없는 듯 무심하고 시큰둥한 태도를 취하지만, 속으로는 다시 기대했다가 실망하거나 상처받는 것이 두려워 아예 처음부터 시선을 피해버리는 방어기제가 작동하고 있습니다. [상황 및 리딩 가이딩]: 과거의 아쉬움이나 무기력함에 빠져 지금 눈앞에 다가온 새로운 기회나 다정한 손길을 놓치고 있지 않은지 돌아봐야 합니다. 팔짱을 풀고 주변의 긍정적인 신호를 살펴보라고 조언합니다." },
            { id: "C5", title: "FIVE OF CUPS (컵 5)", desc: "[키워드: 깊은 상실감, 아쉬움과 후회, 슬픔에 매몰됨, 등 뒤에 남아 있는 희망] 검은 망토를 두른 채 바닥에 쏟아진 세 개의 잔만 바라보며 슬퍼하느라, 등 뒤에 온전히 서 있는 두 개의 잔을 보지 못하는 에너지입니다. 지나간 실수나 상처에 시선이 묶여 있는 상태입니다. [심리 양면성(콜드 리딩)]: 겉으로는 괜찮은 척 일상을 이어가려 하지만, 내면의 시선은 여전히 내가 잃어버린 것이나 서운했던 순간에만 머물러 스스로를 슬픔의 그림자 속에 가두고 있습니다. [상황 및 리딩 가이딩]: 잃어버린 것 때문에 마음 아파하는 것은 자연스럽지만 모든 것이 끝난 것은 아닙니다. 슬픔을 충분히 추스른 뒤에는 고개를 돌려 아직 내 곁에 온전히 남아 있는 두 개의 잔(소중한 인연과 새로운 가능성)을 보라고 다독입니다." },
            { id: "C6", title: "SIX OF CUPS (컵 6)", desc: "[키워드: 순수한 추억과 향수, 그리움과 재회, 다정한 배려, 익숙한 편안함, 동심] 꽃이 담긴 잔을 건네는 아이들처럼 계산 없는 순수함과 옛 시절의 따스한 기억을 불러일으키는 에너지입니다. 과거의 인연에게 연락이 오거나 오래 알고 지낸 관계, 익숙한 곳에서 위안을 얻는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 따뜻하고 순수한 정을 나누는 모습이지만, 속으로는 거칠고 피곤한 현재의 현실에서 도망쳐 무조건 나를 보호해 주던 안전하고 익숙한 과거의 기억 속으로 숨고 싶어 하는 마음이 있습니다. [상황 및 리딩 가이딩]: 계산 없이 순수하고 다정한 마음으로 다가가면 관계가 부드럽게 풀립니다. 옛 경험이나 인연에서 따뜻한 힌트를 얻을 수 있으나, 과거의 그림자에만 머물러 현재의 성장을 미루지는 말라고 덧붙입니다." },
            { id: "C7", title: "SEVEN OF CUPS (컵 7)", desc: "[키워드: 수많은 선택지, 달콤한 환상과 공상, 결정 장애, 부풀려진 욕망, 현실 감각 필요] 구름 속에 떠 있는 일곱 개의 잔마다 온갖 매혹적인 것들이 담겨 있어 무엇을 고를지 혼란스러운 에너지입니다. 상상과 기대, 혹은 걱정이 부풀어 올라 현실적인 초점이 흐려진 상태입니다. [심리 양면성(콜드 리딩)]: 겉으로는 꿈이 많고 다양한 가능성을 열어둔 것처럼 보이지만, 내면에는 현실의 땀과 노력을 들이기보다 머릿속의 달콤한 상상으로만 도피하며 선택의 책임을 미루고 있는 혼란이 깔려 있습니다. [상황 및 리딩 가이딩]: 선택지가 많아 보이거나 장밋빛 환상에 빠지기 쉬운 때입니다. 구름 같은 허상을 걷어내고, 지금 실제로 실현 가능하고 내게 꼭 필요한 단 하나가 무엇인지 냉정하게 가려내야 합니다." },
            { id: "C8", title: "EIGHT OF CUPS (컵 8)", desc: "[키워드: 미련 없는 떠남, 정서적 독립, 공허함 극복, 더 깊은 가치 탐색, 마음의 전환] 애써 쌓아 올린 여덟 개의 잔을 등지고 먼 산을 향해 묵묵히 걸어 나가는 결단의 에너지입니다. 겉보기엔 남부러울 것 없더라도 마음이 이미 지쳤거나 더 이상 영혼을 채워주지 못하는 상황에서 벗어나는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 그동안 공들인 일이나 관계를 잘 유지해 온 것처럼 보이지만, 속으로는 이미 오래전부터 깊은 공허함과 피로를 느끼며 조용히 마음의 짐을 싸고 있었던 지친 진심이 드러납니다. [상황 및 리딩 가이딩]: 빈껍데기만 남은 감정을 참으며 억지로 머물기보다, 진정으로 내 마음을 채워줄 새로운 길을 찾아 떠날 용기가 필요한 시점입니다. 이 걸음은 도피가 아니라 더 성숙한 단계로 나아가는 여정입니다." },
            { id: "C9", title: "NINE OF CUPS (컵 9)", desc: "[키워드: 소원 성취, 깊은 만족감, 정서적·물질적 여유, 자부심, 위시 카드(Wish Card)] 아홉 개의 잔을 병풍처럼 뒤에 나란히 세워두고 흡족한 미소를 짓고 있는 만족의 에너지입니다. 바라는 일이 이루어지고 마음이 풍족해지며 자존감이 채워지는 긍정적인 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 여유롭고 모든 것이 만족스러운 듯 미소 짓고 있지만, 내면에는 내 감정적 안락함과 자존심을 최우선으로 지키려다 보니 상대에게 먼저 깊이 파고들지 않고 적당한 거리를 두는 자기애가 자리하고 있습니다. [상황 및 리딩 가이딩]: 당신이 공들여온 일이나 소망하던 바가 기분 좋은 결과로 이어집니다. 성취감을 마음껏 누리되, 자기만족에 그쳐 안일해지거나 주변에 무심해지지 않도록만 균형을 잡으면 좋습니다." },
            { id: "C10", title: "TEN OF CUPS (컵 10)", desc: "[키워드: 완전한 행복, 정서적 안정, 화목한 유대와 공동체, 축복받은 결말, 마음의 고향] 하늘에 뜬 무지개와 열 개의 잔 아래에서 서로를 안고 기뻐하는 궁극적인 감정적 완성의 에너지입니다. 관계의 평화, 깊은 소속감, 오래 지속될 정서적 충만함을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 더할 나위 없이 평화롭고 다정한 관계를 지향하지만, 속으로는 그 완벽한 평화를 깨뜨릴지 모른다는 두려움 때문에 사소한 서운함이나 갈등의 씨앗을 혼자 삼키며 덮어두려는 마음이 있기도 합니다. [상황 및 리딩 가이딩]: 갈등이 해소되고 소중한 사람들과 깊은 안정과 행복을 누리게 됩니다. 혼자만의 성공보다 함께 나누는 조화와 따뜻한 유대감이 가장 큰 복임을 전해줍니다." },
            { id: "C11", title: "PAGE OF CUPS (컵 페이지)", desc: "[키워드: 순수한 호감, 다정한 메시지, 섬세한 감수성, 여린 마음, 사랑스러운 어리광] 잔 속에서 고개를 내민 물고기와 다정하게 눈을 맞추는 소년의 에너지입니다. 수줍은 고백이나 따뜻한 위로의 연락, 혹은 엉뚱하지만 사랑스러운 영감과 애정이 찾아옴을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 다정하고 솔직하게 마음을 표현하는 듯하지만, 속으로는 상대의 아주 작은 표정 변화나 말투 하나에도 쉽게 상처받고 눈치를 보는 유리알처럼 여린 감수성이 숨어 있습니다. [상황 및 리딩 가이딩]: 계산하지 않는 솔직하고 부드러운 감정 표현이 관계를 여는 열쇠가 됩니다. 다만 작은 일에 감정이 쉽게 출렁이거나 서운함에 빠지지 않도록 마음을 단단히 다독여 줍니다." },
            { id: "C12", title: "KNIGHT OF CUPS (컵 나이트)", desc: "[키워드: 로맨틱한 제안, 다정한 접근, 이상주의, 감성적 매너, 호의적인 손길] 백마를 타고 성배를 소중히 받쳐 든 채 우아하게 다가오는 기사의 에너지입니다. 호감 있는 사람의 다정한 대시, 좋은 조건의 제안, 혹은 감성적이고 평화로운 문제 해결을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 누구보다 다정하고 로맨틱하며 친절한 태도를 보이지만, 내면에는 현실의 무겁고 골치 아픈 책임보다는 아름답고 좋은 분위기만 취하고 싶어 하는 감상적인 이상주의가 깔려 있습니다. [상황 및 리딩 가이딩]: 따뜻한 호의나 반가운 제안이 다가오는 흐름입니다. 부드럽고 공감 어린 태도로 소통하면 좋으나, 분위기나 달콤한 말에만 취해 현실적인 조건을 놓치지 않도록 점검해 줍니다." },
            { id: "C13", title: "QUEEN OF CUPS (컵 퀸)", desc: "[키워드: 깊은 공감력, 정서적 포용, 섬세한 직관, 헌신적 배려, 내면의 치유] 물가의 왕좌에 앉아 정교하게 닫힌 성배를 깊이 응시하는 자애로운 여왕의 에너지입니다. 타인의 아픔과 숨겨진 감정을 스펀지처럼 이해하고 보듬어 주는 성숙하고 깊은 내면을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 남들의 이야기를 다 들어주고 따뜻하게 감싸주는 안식처 같은 사람이지만, 정작 내 마음속의 가장 깊은 성배(본심과 상처)는 단단히 뚜껑을 닫아둔 채 혼자서만 감정을 삭이는 외로움이 있습니다. [상황 및 리딩 가이딩]: 차가운 논리로 따지기보다 따뜻한 공감과 경청으로 다가가야 마음이 열립니다. 단, 타인의 감정에 지나치게 이입해 내 마음까지 물들어 지치지 않도록 정서적 경계선을 지키는 것이 중요합니다." },
            { id: "C14", title: "KING OF CUPS (컵 킹)", desc: "[키워드: 감정의 성숙한 통제, 너그러운 포용, 지혜로운 조언, 흔들림 없는 평정심, 깊은 애정] 거센 파도가 치는 바다 한가운데에서도 흔들림 없이 왕좌를 지키고 있는 바다의 왕 에너지입니다. 속으로는 누구보다 깊고 뜨거운 감정과 애정을 품고 있으면서도 겉으로는 침착하고 어른스럽게 상황을 조율합니다. [심리 양면성(콜드 리딩)]: 겉으로는 어떤 파도 앞에서도 태연하고 여유로운 어른의 얼굴을 하고 있지만, 그 수면 아래에는 차마 겉으로 다 드러내지 못할 만큼 거대하게 일렁이는 애틋함과 외로움의 해류가 흐르고 있습니다. [상황 및 리딩 가이딩]: 감정이 요동치는 상황일수록 중심을 잃지 않는 침착함과 포용력이 필요합니다. 감정에 휘둘리지 않고 따뜻하면서도 단단하게 문제를 다독이면 상대의 가장 깊은 신뢰와 마음을 얻게 됩니다." },

            // Minor Arcana - Swords (S1 ~ S14) : 이성, 결단, 갈등, 생각 (공기의 원소)
            { id: "S1", title: "ACE OF SWORDS (소드 에이스)", desc: "[키워드: 명쾌한 결단, 날카로운 통찰, 강력한 돌파구, 진실 규명, 이성적 시작] 구름을 뚫고 나온 손이 왕관이 씌워진 양날의 검을 곧게 치켜든 서늘하고도 강력한 에너지입니다. 복잡한 감정이나 혼란을 단칼에 정리하고 명확한 결론과 전략으로 나아감을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 흔들림 없이 단호하고 차갑게 결단을 내리는 듯하지만, 속으로는 애매한 희망 고문이나 감정의 혼란에 더 이상 시달리기 싫어 차라리 날카로운 칼날로 매듭을 지으려는 절박함이 있습니다. [상황 및 리딩 가이딩]: 질질 끌던 문제를 명확한 기준과 이성으로 결단내려야 할 때입니다. 날카로운 판단력이 확실한 돌파구를 만들어주지만, 말이 너무 차갑게 나가 상처를 주지 않도록 표현은 다듬으라고 조언합니다." },
            { id: "S2", title: "TWO OF SWORDS (소드 2)", desc: "[키워드: 팽팽한 대치, 결정 보류, 외면과 방어기제, 마음의 빗장, 딜레마] 눈을 가린 채 두 자루의 검을 가슴 앞에 교차해 들고 바닷가에 앉아 있는 긴장 상태의 에너지입니다. 진실을 마주하기 두렵거나 어느 한쪽도 선택할 수 없어 마음의 문을 닫고 버티는 모습입니다. [심리 양면성(콜드 리딩)]: 겉으로는 평정심을 유지하며 아무 일도 없는 듯 버티고 있지만, 내면에는 눈가리개를 푸는 순간 마주해야 할 현실과 상처가 두려워 아예 눈과 귀를 막아버린 위태로운 회피 심리가 작동하고 있습니다. [상황 및 리딩 가이딩]: 문제를 모른 척 눈감고 있는다고 해서 파도가 저절로 잠잠해지지 않습니다. 두려움을 내려놓고 눈가리개를 풀어 현실과 내 진짜 감정을 직시해야 비로소 답답한 교착 상태에서 벗어날 수 있습니다." },
            { id: "S3", title: "THREE OF SWORDS (소드 3)", desc: "[키워드: 마음의 상처, 아픈 진실, 이별과 갈등, 가시 돋친 말, 슬픔을 통한 정화] 비 내리는 먹구름 아래 붉은 심장에 세 자루의 검이 꽂혀 있는 날카로운 아픔의 에너지입니다. 말로 인한 상처, 기대가 무너지는 실망, 혹은 피할 수 없는 갈등과 애증의 통증을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 차갑고 날 선 말로 상대를 밀어내거나 아무렇지 않은 척 독하게 굴지만, 속으로는 이미 심장에 칼이 꽂힌 것처럼 시리고 아파서 먼저 가시를 세우는 서글픈 방어본능이 숨어 있습니다. [상황 및 리딩 가이딩]: 마음이 시리고 아픈 순간이지만 상처를 억지로 외면하기보다 충분히 아파하고 쏟아내야 새살이 돋습니다. 감정적인 가시 돋친 말만 주의하며 이 비구름을 지나가면 한결 단단해질 것입니다." },
            { id: "S4", title: "FOUR OF SWORDS (소드 4)", desc: "[키워드: 일시적 휴식, 에너지 재충전, 생각 비우기, 전략적 후퇴, 고요한 재정비] 성당 안 석관 위에 누워 두 손을 모으고 고요히 눈을 감고 있는 휴면의 에너지입니다. 치열한 고민이나 갈등 끝에 지친 몸과 과열된 머리를 잠시 멈추고 회복해야 하는 시간입니다. [심리 양면성(콜드 리딩)]: 겉으로는 조용히 물러나 쉬고 있는 것처럼 보이지만, 내면에는 당장 움직여야 한다는 압박감과 아무것도 할 에너지가 남아 있지 않다는 탈진 상태가 부딪히며 잠시 세상과 연결을 끊고 싶어 합니다. [상황 및 리딩 가이딩]: 지금은 무리하게 답을 내거나 상대를 추궁할 때가 아닙니다. 과열된 생각과 지친 마음을 쉬게 해주는 전략적 멈춤이 꼭 필요하며, 충분히 숨을 고른 뒤에 다시 움직이라고 안내합니다." },
            { id: "S5", title: "FIVE OF SWORDS (소드 5)", desc: "[키워드: 상처뿐인 승리, 소모적인 기싸움, 날 선 자존심 대립, 씁쓸한 뒷맛, 양보 없는 집착] 싸움이 끝난 자리에서 검을 거머쥔 인물이 돌아서는 이들을 바라보는 서늘한 에너지입니다. 말싸움이나 주도권 경쟁에서 이기기는 했으나 관계에 생채기가 나고 마음 한편이 찜찜한 상태를 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 절대 지지 않으려 날카롭게 상대를 몰아붙이고 승기를 잡으려 하지만, 속으로는 내가 먼저 숙이면 무시당하거나 버림받을까 봐 두려워 자존심이라는 갑옷 뒤에 숨어 있는 공허함이 있습니다. [상황 및 리딩 가이딩]: 현실에서는 자존심 싸움에서 이기는 것이 정말 나에게 이득인지 돌아보고 한발 물러서는 지혜가 필요하며, 캐릭터 관계 서사에서는 서로에게 생채기를 내면서도 절대 주도권을 놓지 않으려는 지독하고 아슬아슬한 혐관의 텐션으로 풀어냅니다." },
            { id: "S6", title: "SIX OF SWORDS (소드 6)", desc: "[키워드: 조용한 이동, 난관 탈출, 점진적 회복, 환경의 전환, 폭풍우를 뒤로하고] 거친 물결을 뒤로하고 잔잔한 수면을 향해 나룻배를 타고 건너가는 이동과 회복의 에너지입니다. 비록 배 위에 여섯 자루의 검(지나온 기억과 상처)은 실려 있지만, 가장 힘들었던 고비는 지나고 평온한 곳으로 나아가는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 묵묵히 상황을 정리하고 다음 단계로 나아가는 듯하지만, 내면에는 아직 완전히 털어내지 못한 지난 상처와 미련을 배 한구석에 싣고 가는 쓸쓸한 안도감이 교차하고 있습니다. [상황 및 리딩 가이딩]: 당장 완벽하게 신나는 상태는 아니더라도 해류는 분명 더 잔잔하고 나은 쪽으로 흘러가고 있습니다. 지나간 거친 파도에 시선을 두지 말고 새로운 환경과 회복을 향해 차분히 노를 저어가세요." },
            { id: "S7", title: "SEVEN OF SWORDS (소드 7)", desc: "[키워드: 은밀한 전략, 우회적 방법, 눈치 보기, 감춰진 본심, 영리한 임기응변] 다섯 자루의 검을 몰래 품에 안고 뒤를 돌아보며 발소리를 죽여 빠져나오는 아슬아슬한 에너지입니다. 정면 승부가 부담스러워 머리를 쓰거나, 속마음을 숨긴 채 상황을 살피는 흐름을 암시합니다. [심리 양면성(콜드 리딩)]: 겉으로는 능청스럽게 웃거나 아무렇지 않은 척 요령껏 행동하지만, 속으로는 내 진짜 패나 약점을 들키면 불리해질까 봐 본심을 꽁꽁 숨기고 끊임없이 눈치를 보는 불안감이 깔려 있습니다. [상황 및 리딩 가이딩]: 무턱대고 정면으로 부딪히기보다 유연하고 영리한 우회 전략이 필요할 수 있습니다. 다만 얄팍한 꼼수나 회피로 위기를 모면하려다 소중한 신뢰를 잃지 않도록 주의하라고 조언합니다." },
            { id: "S8", title: "EIGHT OF SWORDS (소드 8)", desc: "[키워드: 자기검열, 생각의 감옥, 학습된 무기력, 두려움이 만든 족쇄, 내면의 위축] 여덟 자루의 검에 둘러싸여 눈과 몸이 묶인 채 꼼짝 못 하고 서 있는 답답한 에너지입니다. 하지만 자세히 보면 발은 묶여 있지 않고 검 사이에도 넓은 틈이 있어, 실제로는 내 두려움과 부정적 생각이 나를 가두고 있음을 보여줍니다. [심리 양면성(콜드 리딩)]: 겉으로는 상황이 어쩔 수 없다며 얌전히 멈춰 서 있는 듯하지만, 내면에는 내가 직접 선택하고 움직였다가 실패하거나 비난받는 것이 두려워 스스로 눈을 가리고 피해자 자리에 머무는 위축된 심리가 있습니다. [상황 및 리딩 가이딩]: '어차피 안 될 거야'라는 머릿속의 생각이 가장 큰 감옥입니다. 실제 현실은 생각보다 절망적이지 않으니, 스스로 만든 한계에서 벗어나 작은 발걸음부터 직접 떼어보라고 용기를 줍니다." },
            { id: "S9", title: "NINE OF SWORDS (소드 9)", desc: "[키워드: 깊은 고뇌와 불면, 과도한 걱정과 불안, 자책, 머릿속의 폭풍우, 예민함] 어두운 밤 자리에서 일어나 두 손으로 얼굴을 감싸 쥐고 괴로워하는 극심한 스트레스의 에너지입니다. 아직 일어나지도 않은 최악의 시나리오를 머릿속으로 되감으며 스스로를 갉아먹는 상태입니다. [심리 양면성(콜드 리딩)]: 낮이나 남들 앞에서는 그럭저럭 아무 일 없는 듯 일상을 버텨내지만, 혼자 남겨지는 순간에는 사소한 실수나 불안이 거대한 칼날처럼 불어나 스스로를 가혹하게 자책하는 여리고 예민한 내면이 드러납니다. [상황 및 리딩 가이딩]: 당신을 짓누르는 아홉 자루의 검은 현실에 꽂힌 칼이 아니라 벽에 걸린 머릿속의 생각들일 뿐입니다. 생각이 깊어질수록 그림자만 길어지니 자책을 멈추고, 고민을 밖으로 털어놓거나 눈앞의 사실에만 집중하라고 따뜻하게 위로합니다." },
            { id: "S10", title: "TEN OF SWORDS (소드 10)", desc: "[키워드: 완전한 바닥, 고통의 마침표, 피할 수 없는 종결, 먹구름 뒤의 새벽빛, 반전의 시작] 열 자루의 검을 맞고 쓰러져 있는 처절한 모습이지만, 저 멀리 짙은 어둠이 걷히며 황금빛 여명이 스며드는 반전의 에너지입니다. 상황이 더 이상 나빠질 수 없는 끝까지 갔기에 이제는 올라갈 일만 남았음을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 모든 것이 끝났다며 깊게 지쳐 쓰러져 있지만, 내면 깊은 곳에서는 차라리 이렇게 바닥을 치고 나니 더 이상 잃을 것도 두려울 것도 없다는 묘한 해방감과 후련함이 함께 숨 쉬고 있습니다. [상황 및 리딩 가이딩]: 힘들고 아팠던 한 주기가 완전히 끝났습니다. 이미 끝난 일에 매달려 스스로를 한 번 더 찌르기보다, 바닥을 쳤으니 이제 수평선 너머로 밝아오는 새로운 전환점을 맞이할 준비를 하라고 희망을 전합니다." },
            { id: "S11", title: "PAGE OF SWORDS (소드 페이지)", desc: "[키워드: 예리한 관찰, 정보 수집과 탐색, 팽팽한 경계심, 솔직하고 날 선 소통, 호기심] 바람 부는 언덕에서 검을 쥐고 주변을 날카롭게 살피는 재빠른 소년의 에너지입니다. 두뇌 회전과 분석력이 뛰어나 상황을 빠르게 파악하지만, 아직 마음이 여려 방어적으로 날을 세우거나 눈치를 많이 볼 수 있습니다. [심리 양면성(콜드 리딩)]: 겉으로는 똑 부러지고 쿨하게 할 말을 다 하는 것처럼 보이지만, 속으로는 상대의 반응을 몰래 염탐하며 상처받기 전에 먼저 방어막을 치려는 긴장감과 불안이 반짝이고 있습니다. [상황 및 리딩 가이딩]: 꼼꼼하게 정보를 모으고 상황을 살피는 태도가 큰 도움이 됩니다. 다만 확인되지 않은 추측에 예민하게 날을 세우거나 톡 쏘는 말투로 본심을 가리지 않도록 다듬어 줍니다." },
            { id: "S12", title: "KNIGHT OF SWORDS (소드 나이트)", desc: "[키워드: 거침없는 돌파, 논리적 추궁, 초고속 결단, 타협 없는 직진, 서늘한 추진력] 거센 맞바람을 가르며 검을 높이 들고 전속력으로 달려나가는 냉철한 기사의 에너지입니다. 목표나 결론이 정해지면 감정 따위는 제쳐두고 가장 빠르고 직선적인 방법으로 밀어붙이는 강력한 돌파력을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 막힘없이 논리적이고 단호하게 돌진하는 모습이지만, 내면에는 모호한 감정선이나 기다림을 견디지 못해 빨리 흑백을 가려버리고 싶어 하는 날 선 조급함이 깔려 있습니다. [상황 및 리딩 가이딩]: 명쾌한 판단력과 속도로 문제를 단번에 베어 넘길 힘이 있습니다. 그러나 내 논리만 맞다고 확신해 주변 사람의 섬세한 감정을 다치게 하거나 성급하게 결론으로 치닫지 않도록 속도 조절을 권합니다." },
            { id: "S13", title: "QUEEN OF SWORDS (소드 퀸)", desc: "[키워드: 냉철한 지성, 명확한 공사 구분, 단단한 독립심, 본질을 꿰뚫는 통찰, 성숙한 경계선] 구름 위 왕좌에서 오른손에는 곧은 검을 들고 왼손은 열어젖힌 채 진실을 마주하는 지혜로운 여왕의 에너지입니다. 수많은 아픔과 시련을 겪어내어 감정에 휘둘리지 않고 사안의 핵심을 정확히 짚어내는 성숙한 이성을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 빈틈없고 차가워 보일 만큼 혼자서도 완벽하게 잘 지내는 모습이지만, 그 단호한 칼날 뒤에는 과거의 상처를 겪으며 다시는 아무에게나 쉽게 마음을 허락하지 않겠다고 다짐한 깊은 고독과 애틋함이 숨어 있습니다. [상황 및 리딩 가이딩]: 어설픈 인정에 끌려다니지 말고 객관적인 기준과 원칙으로 선을 그어야 합니다. 차가워 보일지라도 지금의 명확하고 독립적인 태도가 당신과 소중한 가치를 가장 안전하게 지켜줍니다." },
            { id: "S14", title: "KING OF SWORDS (소드 킹)", desc: "[키워드: 공정한 권위, 고도의 전략과 분석, 냉정한 판단, 전문가적 식견, 이성적 통솔] 정면을 똑바로 응시하며 흔들림 없는 법도와 이성으로 판결을 내리는 지성의 왕 에너지입니다. 사사로운 감정을 배제하고 객관적 타당성과 전략만으로 전체를 통솔하는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 피도 눈물도 없는 듯 완벽한 논리와 원칙으로 무장하고 있지만, 내면에는 감정을 드러내는 것을 약점으로 여겨 자신의 따뜻한 본심이나 연약함마저 철저히 통제하려는 외로운 절제가 자리하고 있습니다. [상황 및 리딩 가이딩]: 감상적인 태도를 거두고 전문가다운 냉철함과 전략으로 접근해야 할 때입니다. 명확한 논리와 원칙을 세우면 어떤 복잡하게 얽힌 문제도 깔끔하게 정리할 수 있습니다." },

            // Minor Arcana - Pentacles (P1 ~ P14) : 물질, 현실, 금전, 성실함, 신뢰 (흙의 원소)
            { id: "P1", title: "ACE OF PENTACLES (펜타클 에이스)", desc: "[키워드: 확실한 현실적 기회, 금전운과 보상, 안정된 출발, 실질적 이득, 오래갈 인연의 씨앗] 정원 위로 내밀어진 손바닥 위에 황금빛 펜타클이 영롱하게 빛나는 풍요로운 시작의 에너지입니다. 뜬구름 잡는 이야기가 아니라 눈에 보이는 수익, 취업, 계약, 혹은 현실적으로 든든한 관계의 출발을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 차분하고 실속 있게 기회를 챙기는 모습이지만, 속으로는 불확실한 감정이나 모험보다 눈에 보이고 손에 잡히는 확실한 안전보장이 있어야만 비로소 안심하는 신중함이 깔려 있습니다. [상황 및 리딩 가이딩]: 실질적인 이득과 안정을 가져다줄 좋은 기회가 눈앞에 왔습니다. 현실적인 기반을 다지기에 아주 좋은 흐름이니 주저하지 말고 단단히 붙잡으라고 조언합니다." },
            { id: "P2", title: "TWO OF PENTACLES (펜타클 2)", desc: "[키워드: 유연한 균형 잡기, 멀티태스킹, 자금과 시간의 조율, 능숙한 적응력, 아슬아슬한 줄타기] 파도치는 바다를 배경으로 무한대 리본에 묶인 두 개의 펜타클을 능숙하게 저글링하는 에너지입니다. 두 가지 일이나 감정, 상황 사이에서 아슬아슬하지만 유연하게 균형을 맞추며 굴러가는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 바쁜 와중에도 웃으며 능숙하게 모든 일을 해내는 것처럼 보이지만, 속으로는 손에 쥔 것 중 하나라도 떨어뜨릴까 봐 쉴 새 없이 발을 구르며 아슬아슬하게 버티는 피로가 쌓여 있습니다. [상황 및 리딩 가이딩]: 변화무쌍한 파도 속에서도 당신은 리듬을 타며 잘 해내고 있습니다. 다만 너무 많은 것을 동시에 돌리다 과부하가 걸리지 않도록 우선순위를 점검하며 실속을 챙기라고 안내합니다." },
            { id: "P3", title: "THREE OF PENTACLES (펜타클 3)", desc: "[키워드: 전문적인 협업, 실력 인정, 든든한 팀워크, 탄탄한 기초 공사, 상호 존중] 성당을 짓는 석공과 건축가들이 설계도를 보며 진지하게 의견을 나누는 협력과 장인정신의 에너지입니다. 각자의 역할과 전문성을 모아 완성도 높은 결과물을 만들어내고 그 실력을 인정받는 시기입니다. [심리 양면성(콜드 리딩)]: 겉으로는 사람들과 원만하게 협력하며 맡은 바를 해내지만, 내면에는 내 실력과 노력이 남들에게 제대로 인정받고 있는지 끊임없이 신경 쓰는 완벽주의적 긴장감이 있습니다. [상황 및 리딩 가이딩]: 혼자 끙끙대며 해결하려 하기보다 동료나 파트너와 힘을 합치면 훨씬 훌륭한 성과가 납니다. 기본기를 충실히 다지고 소통하며 차근차근 탑을 쌓아 올리라고 조언합니다." },
            { id: "P4", title: "FOUR OF PENTACLES (펜타클 4)", desc: "[키워드: 강한 소유욕과 집착, 안전 제일주의, 보수적 방어, 변화 거부, 내 것 지키기] 머리 위와 발아래, 그리고 두 팔로 펜타클을 꽉 움켜쥔 채 조금도 내어주지 않으려는 방어적인 에너지입니다. 이미 가진 자산이나 자리, 혹은 소중한 사람을 잃을까 봐 현상 유지와 독점에 매달리는 상태를 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 빈틈없이 자기 것을 챙기고 흔들림 없이 안정된 것처럼 보이지만, 속으로는 지금 쥔 것을 조금이라도 놓으면 모든 것을 잃고 상처받을까 봐 두려워 온몸에 힘을 주고 있는 불안이 숨어 있습니다. [상황 및 리딩 가이딩]: 자산을 지키고 안정을 유지하는 데는 유리하지만 지나친 집착이나 방어는 새로운 기회와 관계의 숨통까지 막아버릴 수 있습니다.(관계 서사에서는 상대를 누구에게도 뺏기기 싫어 품에 가두려는 귀여운 독점욕이나 집착으로 나타납니다.) 쥔 손을 조금만 펴고 흐름을 허용하라고 가이딩합니다." },
            { id: "P5", title: "FIVE OF PENTACLES (펜타클 5)", desc: "[키워드: 현실적·정서적 결핍, 소외감과 추위, 시련의 통과, 눈앞의 도움 발견하기, 고난 속의 동행] 눈보라 치는 추운 밤길, 지친 두 사람이 밝게 빛나는 성당의 스테인드글라스 창문 밑을 그냥 지나쳐 가는 에너지입니다. 금전적 압박이나 정서적 외로움에 빠져 세상에 혼자 남겨진 듯한 막막함을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 남들에게 아쉬운 소리를 하지 않고 혼자 추위를 견디는 척하지만, 속으로는 누군가 먼저 내 시린 손을 잡아주길 바라면서도 자존심과 자격지심 때문에 코앞의 따뜻한 문조차 두드리지 못하고 있습니다. [상황 및 리딩 가이딩]: 당장은 춥고 결핍이 크게 느껴지겠지만 고개만 들면 바로 옆에 따뜻한 등불(도움의 손길과 해결책)이 켜져 있습니다.(페어 서사에서는 세상의 눈보라 속에서도 서로의 체온에만 의지해 함께 걸어가는 애틋한 구원과 동행을 뜻합니다.) 자존심 때문에 도움을 외면하지 말고 고개를 들라고 따뜻하게 일깨워 줍니다." },
            { id: "P6", title: "SIX OF PENTACLES (펜타클 6)", desc: "[키워드: 균형 잡힌 나눔, 정당한 보상, 도움 주고받기, 상호 호혜, 관계의 온도차 조율] 한 손에 저울을 든 상인이 필요한 이들에게 합당한 만큼의 금화를 나누어 주는 에너지입니다. 투자와 노력에 대한 정당한 회수, 귀인의 실질적인 도움, 혹은 관계에서 주고받는 마음의 무게를 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 너그럽게 베풀거나 합리적으로 주고받는 듯하지만, 내면에는 내가 쏟은 마음과 정성만큼 상대에게서도 공정한 보답을 받고 있는지 은밀하게 저울질하는 서운함과 계산이 공존합니다. [상황 및 리딩 가이딩]: 베풀면 돌아오고 도움을 청하면 손길이 닿는 선순환의 시기입니다. 다만 관계나 거래에서 어느 한쪽만 일방적으로 퍼주거나 상하관계로 기울어지지 않도록 건강한 균형을 유지하라고 조언합니다." },
            { id: "P7", title: "SEVEN OF PENTACLES (펜타클 7)", desc: "[키워드: 중간 점검, 성장을 기다리는 인내, 방향성 고민, 수확 전의 숨고르기, 가성비 검토] 농부가 그동안 애써 키워온 덩굴에 맺힌 일곱 개의 펜타클을 물끄러미 바라보며 괭이에 기대어 서 있는 에너지입니다. 어느 정도 성과는 나왔지만 이대로 계속 갈지, 방식을 바꿀지 깊이 생각해보는 시점입니다. [심리 양면성(콜드 리딩)]: 겉으로는 차분히 결과를 지켜보며 쉬어가는 듯하지만, 속으로는 '내가 들인 시간과 노력에 비해 결과가 이것뿐인가' 하는 회의감과 더 나은 길을 찾아야 하나 싶은 갈등이 조용히 일렁이고 있습니다. [상황 및 리딩 가이딩]: 그동안의 노력이 결코 헛되지 않고 자라나고 있으니 조급해할 필요 없습니다. 지금은 무작정 힘만 빼기보다 지금까지의 흐름을 객관적으로 점검하고 더 효율적인 다음 전략을 세울 때입니다." },
            { id: "P8", title: "EIGHT OF PENTACLES (펜타클 8)", desc: "[키워드: 성실한 몰입, 장인정신, 꾸준한 반복과 숙련, 디테일 완성, 묵묵한 노력] 작업대에 앉아 오직 눈앞의 펜타클을 정교하게 깎아내는 데만 온 신경을 집중하고 있는 장인의 에너지입니다. 요행을 바라지 않고 성실한 노력과 반복을 통해 실력과 자산, 신뢰를 차곡차곡 쌓아 올리는 흐름입니다. [심리 양면성(콜드 리딩)]: 겉으로는 한눈팔지 않고 묵묵히 자기 일에 몰입하는 성실한 모습이지만, 내면에는 눈앞의 작은 디테일에만 매달리느라 정작 큰 그림이나 내 마음의 여유를 돌보지 못하는 답답함이 있기도 합니다. [상황 및 리딩 가이딩]: 지금 가장 강력한 무기는 꾸준함과 성실함입니다. 당장 화려한 스포트라이트가 비치지 않아도 지금 묵묵히 쌓고 있는 시간과 정성이 조만간 누구도 흉내 낼 수 없는 확실한 결실로 보답할 것입니다." },
            { id: "P9", title: "NINE OF PENTACLES (펜타클 9)", desc: "[키워드: 자수성가, 품격 있는 여유, 경제적·정신적 독립, 결실의 향유, 높은 자존감] 풍요롭게 익은 포도밭 정원에서 화려한 옷을 입고 매를 손에 얹은 채 우아하게 산책하는 에너지입니다. 자신의 능력과 철저한 자기관리로 일궈낸 높은 수준의 안정과 독립적인 만족감을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 남부러울 것 없이 우아하고 혼자서도 완벽하게 여유를 누리는 모습이지만, 속으로는 내가 공들여 만든 이 평화로운 정원이 흐트러질까 봐 타인을 쉽게 들이지 못하는 까다로운 방어벽과 은근한 외로움이 숨어 있습니다. [상황 및 리딩 가이딩]: 스스로의 힘으로 충분히 자립하고 여유를 누릴 자격이 있는 시기입니다. 당신의 가치를 높게 세우고 성취를 즐기되, 지나치게 높은 기준 때문에 마음의 문까지 걸어 잠그지만 않으면 더할 나위 없습니다." },
            { id: "P10", title: "TEN OF PENTACLES (펜타클 10)", desc: "[키워드: 탄탄한 기반, 풍요로운 완성, 가문과 조직의 번영, 장기적 안정, 든든한 유산] 세대를 아우르는 가족과 반려견들이 열 개의 펜타클이 수놓인 아치 아래에서 평화롭게 어우러진 궁극의 물질적·현실적 완성 에너지입니다. 일시적인 행운을 넘어 오래도록 흔들리지 않을 든든한 자산, 조직, 깊은 신뢰 관계를 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 가장 안정적이고 풍요로운 울타리 안에서 평온해 보이지만, 내면에는 이미 짜여진 틀과 주변의 기대, 전통적인 책임감에서 벗어나지 못해 새로운 모험을 주저하는 보수적인 마음이 함께 자리합니다. [상황 및 리딩 가이딩]: 금전, 일, 관계 모두에서 매우 안정적이고 믿음직한 결과로 이어집니다. 단기적인 자극이나 이익보다 오래 지속될 신뢰와 장기적인 안정을 선택하는 것이 가장 큰 복을 가져옵니다." },
            { id: "P11", title: "PAGE OF PENTACLES (펜타클 페이지)", desc: "[키워드: 진지한 배움과 탐구, 현실적인 첫걸음, 성실한 태도, 실속 있는 기회, 소중한 집중] 푸른 들판에 서서 두 손으로 펜타클을 소중히 받쳐 들고 연구하듯 바라보는 소년의 에너지입니다. 학업, 자격증, 새로운 업무나 저축처럼 미래의 가치를 위해 기초부터 차근차근 배우고 다지는 시작을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 진지하고 성실하게 목표에 집중하는 기특한 모습이지만, 속으로는 실수하지 않고 완벽하게 해내고 싶은 마음에 작은 일에도 긴장하고 돌다리도 열 번씩 두드리느라 속도가 느려지는 신중함이 있습니다. [상황 및 리딩 가이딩]: 작지만 아주 실속 있고 성장 가능성이 큰 기회입니다. 허황된 욕심을 부리기보다 배우는 자세로 꼼꼼하게 기초를 쌓아가면 머지않아 든든한 결실로 자라납니다." },
            { id: "P12", title: "KNIGHT OF PENTACLES (펜타클 나이트)", desc: "[키워드: 우직한 성실함, 변함없는 책임감, 흔들림 없는 페이스, 안전한 전진, 깊은 신뢰] 묵직한 흑마를 타고 밭이 갈린 대지 위에서 펜타클을 들고 앞을 응시하는 가장 신중하고 성실한 기사의 에너지입니다. 속도는 느리고 화려한 말재주는 없어도, 한 번 맡은 일과 마음은 끝까지 책임지고 지키는 최고의 신뢰를 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 든든하고 흔들림 없이 한결같은 태도를 보이지만, 내면에는 갑작스러운 변화나 예측 불가능한 상황을 두려워해 마음이 있어도 쉽게 발을 떼지 못하는 답답할 정도의 신중함이 깔려 있습니다. [상황 및 리딩 가이딩]: 빠른 지름길을 찾기보다 정직하고 꾸준하게 한 걸음씩 나아가는 것이 결국 이기는 길입니다. 지금의 우직한 성실함과 일관성이 가장 큰 신뢰와 안전한 성공을 만들어 줍니다." },
            { id: "P13", title: "QUEEN OF PENTACLES (펜타클 퀸)", desc: "[키워드: 풍요로운 돌봄, 실용적인 지혜, 현실적 안정감, 살림꾼의 역량, 다정한 안식처] 꽃과 열매가 가득한 자연 속 왕좌에서 펜타클을 따뜻하게 품에 안고 있는 대지의 여왕 에너지입니다. 현실적인 감각과 관리 능력이 뛰어나면서도 주변 사람들을 실질적으로 챙기고 편안하게 해주는 성숙한 내공을 뜻합니다. [심리 양면성(콜드 리딩)]: 겉으로는 남들을 알뜰살뜰 챙기고 무엇이든 해결해 주는 든든한 버팀목 같지만, 속으로는 내 사람과 내 공간을 완벽하게 돌봐야 한다는 책임감 때문에 정작 나 자신의 피로는 뒷전으로 미루는 마음이 있습니다. [상황 및 리딩 가이딩]: 몸과 마음이 편안해지는 현실적인 안정과 실속을 챙겨야 할 때입니다. 자신과 주변을 따뜻하고 실질적으로 보살피는 지혜가 문제를 부드럽고 풍요롭게 해결해 줍니다." },
            { id: "P14", title: "KING OF PENTACLES (펜타클 킹)", desc: "[키워드: 최고의 성취와 부, 든든한 후원자, 탁월한 경영 능력, 흔들리지 않는 기반, 묵직한 책임감] 포도 넝쿨과 황소 조각이 새겨진 왕좌에 앉아 황금 펜타클을 여유롭게 쥐고 있는 현실 세계의 정점에 선 왕의 에너지입니다. 오랜 경험과 실력으로 쌓아 올린 탄탄한 재력, 사회적 성취, 그리고 내 사람을 끝까지 책임지는 넉넉한 안정을 상징합니다. [심리 양면성(콜드 리딩)]: 겉으로는 여유롭고 풍족하며 모든 것을 다 가진 듯 든든한 모습이지만, 내면에는 감정적인 말보다 눈에 보이는 결과와 물질적 책임으로만 마음을 증명하려 하거나 내 방식을 고수하려는 완고함이 숨어 있습니다. [상황 및 리딩 가이딩]: 현실적인 목표를 달성하고 가장 안전하고 풍요로운 결과를 거머쥐게 됩니다. 검증된 방식과 묵직한 책임감으로 상황을 경영하되, 현실적 기준에만 너무 매몰되지 않고 따뜻한 여유를 나누면 완벽한 성공이 됩니다." }
        ];

        let canDraw = false;
        let pickedCards = []; 
        let previewCardEl = null;  
        let currentOneLineAdvice = ""; 
        let isEasterEggMode = false;
        let noticeCloseCallback = null;
        let cardElements = [];

        const DRAG_THRESHOLD = 10; 
        let wheelOffset = 0;       
        let wheelVelocity = 0;     
        let inertiaRafId = null;   
        let swipeGuideTimer = null;

        let isPointerDown = false;
        let isDragging = false;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let lastMoveX = 0;
        let lastMoveTime = 0;
        let dragDistance = 0;
        let downCardEl = null;

        function isMobileWheelMode() {
            return window.innerWidth <= 768;
        }

        function triggerSwipeGuideArrows() {
            const leftArrow = document.getElementById('guide-arrow-left');
            const rightArrow = document.getElementById('guide-arrow-right');
            if (!leftArrow || !rightArrow) return;

            if (swipeGuideTimer) {
                clearTimeout(swipeGuideTimer);
                swipeGuideTimer = null;
            }

            if (!isMobileWheelMode()) {
                leftArrow.classList.remove('is-visible');
                rightArrow.classList.remove('is-visible');
                return;
            }

            leftArrow.classList.remove('is-hidden');
            rightArrow.classList.remove('is-hidden');
            leftArrow.classList.add('is-visible');
            rightArrow.classList.add('is-visible');

            swipeGuideTimer = setTimeout(() => {
                hideSwipeGuideArrows();
            }, 3500);
        }

        function hideSwipeGuideArrows() {
            const leftArrow = document.getElementById('guide-arrow-left');
            const rightArrow = document.getElementById('guide-arrow-right');
            if (!leftArrow || !rightArrow) return;

            leftArrow.classList.remove('is-visible');
            rightArrow.classList.remove('is-visible');
            leftArrow.classList.add('is-hidden');
            rightArrow.classList.add('is-hidden');
        }

        window.onload = () => {
            shuffleAndSpread();
            fetchVisitorCount();
            setupDeckInteractions();

            const deckEl = document.getElementById('deck');
            if (window.ResizeObserver && deckEl) {
                const ro = new ResizeObserver(() => updateSpreadLayout(false));
                ro.observe(deckEl);
            } else {
                window.addEventListener('resize', () => updateSpreadLayout(false));
            }
        };

        function showNoticeModal({ icon = '🌊', title = '닻의 속삭임', message = '', btnText = '확인', onClose = null }) {
            document.getElementById('notice-icon').innerText = icon;
            document.getElementById('notice-title').innerText = title;
            document.getElementById('notice-desc').innerText = message;
            document.getElementById('notice-btn').innerText = btnText;
            noticeCloseCallback = onClose;

            document.getElementById('notice-backdrop').style.display = 'block';
            document.getElementById('notice-modal').style.display = 'block';
        }

        function closeNoticeModal() {
            document.getElementById('notice-backdrop').style.display = 'none';
            document.getElementById('notice-modal').style.display = 'none';
            if (typeof noticeCloseCallback === 'function') {
                const cb = noticeCloseCallback;
                noticeCloseCallback = null;
                cb();
            }
        }

        async function fetchVisitorCount() {
            const countSpan = document.getElementById('visitor-number');
            const COOLDOWN_MS = 60 * 1000; 
            const now = Date.now();

            const lastVisitTime = parseInt(localStorage.getItem('sardina_last_visit_ts') || '0', 10);
            const cachedCount = localStorage.getItem('sardina_cached_count');

            if (cachedCount && (now - lastVisitTime < COOLDOWN_MS)) {
                countSpan.innerText = cachedCount;
                return;
            }

            if (GAS_WEB_APP_URL.startsWith('https://script.google.com')) {
                try {
                    const res = await fetch(GAS_WEB_APP_URL);
                    const data = await res.json();
                    if (data && data.count) {
                        const formatted = data.count.toLocaleString();
                        countSpan.innerText = formatted;
                        localStorage.setItem('sardina_last_visit_ts', now.toString());
                        localStorage.setItem('sardina_cached_count', formatted);
                        return;
                    }
                } catch (e) {
                    console.log('GAS 카운터 연결 대기 중...');
                }
            }
            try {
                const res = await fetch('https://api.counterapi.dev/v1/sardina_destiny/tarot_event/up');
                const data = await res.json();
                const formatted = data.count ? data.count.toLocaleString() : '특별한';
                countSpan.innerText = formatted;
                localStorage.setItem('sardina_last_visit_ts', now.toString());
                localStorage.setItem('sardina_cached_count', formatted);
            } catch (e) {
                countSpan.innerText = cachedCount || '특별한';
            }
        }

        function getShuffledDeck() {
            const arr = [...tarotData];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffleAndSpread() {
            if (inertiaRafId) {
                cancelAnimationFrame(inertiaRafId);
                inertiaRafId = null;
            }
            canDraw = false;
            pickedCards = [];
            previewCardEl = null;
            currentOneLineAdvice = "";
            wheelVelocity = 0;
            resetSlotsUI();
            updateGuideText();

            const deckContainer = document.getElementById('deck');
            deckContainer.innerHTML = '';
            cardElements = [];

            const shuffled = getShuffledDeck();
            wheelOffset = -((shuffled.length - 1) / 2);

            const fragment = document.createDocumentFragment();

            shuffled.forEach((cardData, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.cardId = cardData.id;
                cardEl.dataset.deckIdx = idx;
                cardEl.dataset.baseZ = idx + 1;
                cardEl.style.transform = `translate3d(0px, 0px, 0px) rotate(0deg)`;
                cardEl.style.zIndex = idx + 1;

                cardEl._cardData = cardData;
                const korName = cardData.title.includes('(')
                    ? cardData.title.split('(')[1].replace(')', '')
                    : cardData.title;

                cardEl.innerHTML = `
                    <div class="mobile-tap-tooltip">이 카드를 골라볼까?</div>
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <span class="fallback-card-title">${korName}</span>
                        <img class="front-img" loading="lazy" src="assets/${cardData.id}.jpg" alt="${cardData.title}" onerror="this.style.opacity='0'">
                    </div>
                `;

                cardEl.addEventListener('pointerenter', (e) => {
                    if (!canDraw || isDragging || isMobileWheelMode() || e.pointerType === 'touch') return;
                    if (!cardEl.classList.contains('is-picked-out')) {
                        setPreviewCard(cardEl);
                    }
                });

                fragment.appendChild(cardEl);
                cardElements.push(cardEl);
            });

            deckContainer.appendChild(fragment);

            setTimeout(() => {
                updateSpreadLayout(true);
                triggerSwipeGuideArrows();
                setTimeout(() => {
                    canDraw = true;
                }, 450);
            }, 60);
        }

        function applyCardTransform(cardEl) {
            const x = parseFloat(cardEl.dataset.baseX || 0);
            const y = parseFloat(cardEl.dataset.baseY || 0);
            const angle = parseFloat(cardEl.dataset.baseAngle || 0);
            const z = parseInt(cardEl.dataset.baseZ || 1, 10);

            if (cardEl.classList.contains('is-picked-out')) {
                cardEl.style.transform = `translate3d(${x.toFixed(1)}px, ${(y - 55).toFixed(1)}px, 0px) rotate(${(angle * 0.3).toFixed(2)}deg) scale(0.85)`;
                cardEl.style.opacity = '0';
                cardEl.style.pointerEvents = 'none';
                cardEl.style.zIndex = z;
            } else if (cardEl.classList.contains('is-preview')) {
                const liftY = isMobileWheelMode() ? y - 22 : y - 24;
                const scale = isMobileWheelMode() ? 1.06 : 1.08;
                cardEl.style.transform = `translate3d(${x.toFixed(1)}px, ${liftY.toFixed(1)}px, 0px) rotate(${(angle * 0.3).toFixed(2)}deg) scale(${scale})`;
                cardEl.style.zIndex = 220;
            } else {
                cardEl.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0px) rotate(${angle.toFixed(2)}deg)`;
                cardEl.style.zIndex = z;
            }
        }

        function setPreviewCard(targetEl) {
            if (previewCardEl && previewCardEl !== targetEl) {
                previewCardEl.classList.remove('is-preview');
                applyCardTransform(previewCardEl);
                previewCardEl = null;
            }
            if (targetEl && !targetEl.classList.contains('is-picked-out')) {
                targetEl.classList.add('is-preview');
                previewCardEl = targetEl;
                applyCardTransform(targetEl);
            }
        }

        function getMobileWheelMetrics() {
            const deck = document.getElementById('deck');
            const total = cardElements.length || 78;
            const containerWidth = (deck && deck.clientWidth) ? deck.clientWidth : window.innerWidth;

            const wheelRadius = Math.max(containerWidth * 3.4, 1350);
            const angleStepDeg = containerWidth <= 420 ? 1.02 : 0.92;
            const stepPx = wheelRadius * ((angleStepDeg * Math.PI) / 180);

            const endStopHalfSpanCards = (containerWidth * 0.25) / stepPx;
            const minOffset = -(total - 1) + endStopHalfSpanCards;
            const maxOffset = -endStopHalfSpanCards;

            return {
                containerWidth,
                wheelRadius,
                angleStepDeg,
                minOffset,
                maxOffset
            };
        }

        function clampWheelOffset(offset) {
            const { minOffset, maxOffset } = getMobileWheelMetrics();
            return Math.max(minOffset, Math.min(maxOffset, offset));
        }

        function renderMobileWheel() {
            const deck = document.getElementById('deck');
            const total = cardElements.length;
            if (!deck || total === 0) return;

            const { wheelRadius, angleStepDeg } = getMobileWheelMetrics();
            wheelOffset = clampWheelOffset(wheelOffset);

            const visibleHalfCount = 12.5;

            for (let i = 0; i < total; i++) {
                const cardEl = cardElements[i];
                const diff = i + wheelOffset;
                const absDiff = Math.abs(diff);

                if (absDiff > visibleHalfCount) {
                    if (cardEl.style.display !== 'none') {
                        cardEl.style.display = 'none';
                    }
                    continue;
                }

                if (cardEl.style.display === 'none') {
                    cardEl.style.display = 'block';
                }

                const thetaDeg = diff * angleStepDeg;
                const thetaRad = (thetaDeg * Math.PI) / 180;

                const x = Math.sin(thetaRad) * wheelRadius;
                const y = (wheelRadius - Math.cos(thetaRad) * wheelRadius) - 4;
                const gentleAngle = thetaDeg * 0.75;

                let opacity = 1;
                if (absDiff > visibleHalfCount - 2.0) {
                    opacity = Math.max(0, (visibleHalfCount - absDiff) / 2.0);
                }

                if (cardEl.classList.contains('is-picked-out')) {
                    cardEl.style.opacity = '0';
                } else {
                    cardEl.style.opacity = opacity.toFixed(2);
                }

                cardEl.dataset.baseX = x;
                cardEl.dataset.baseY = y;
                cardEl.dataset.baseAngle = gentleAngle;
                cardEl.dataset.baseZ = i + 10;

                applyCardTransform(cardEl);
            }
        }

        function startWheelInertia() {
            const deck = document.getElementById('deck');
            if (inertiaRafId) cancelAnimationFrame(inertiaRafId);

            function step() {
                wheelVelocity *= 0.94; 
                const nextOffset = wheelOffset + wheelVelocity;
                const clampedOffset = clampWheelOffset(nextOffset);

                if (clampedOffset !== nextOffset) {
                    wheelOffset = clampedOffset;
                    wheelVelocity = 0;
                    renderMobileWheel();
                    inertiaRafId = null;
                    if (deck) deck.classList.remove('is-dragging');
                    return;
                }

                if (Math.abs(wheelVelocity) < 0.0025) {
                    wheelVelocity = 0;
                    inertiaRafId = null;
                    if (deck) deck.classList.remove('is-dragging');
                    return;
                }

                wheelOffset = clampedOffset;
                renderMobileWheel();
                inertiaRafId = requestAnimationFrame(step);
            }

            inertiaRafId = requestAnimationFrame(step);
        }

        function renderPCSpread(animateStagger = false) {
            const deck = document.getElementById('deck');
            const total = cardElements.length;
            if (!deck || total === 0) return;

            const containerWidth = deck.clientWidth;
            const firstCardWidth = cardElements[0].offsetWidth || 72;
            const usableWidth = Math.min(Math.max(containerWidth - firstCardWidth - 40, 320), 660);

            const halfTotal = Math.ceil(total / 2); 

            cardElements.forEach((cardEl, idx) => {
                cardEl.style.display = 'block';
                if (cardEl.classList.contains('is-picked-out')) {
                    cardEl.style.opacity = '0';
                } else {
                    cardEl.style.opacity = '1';
                }

                const row = idx < halfTotal ? 0 : 1;
                const colIdx = row === 0 ? idx : idx - halfTotal;
                const rowCount = row === 0 ? halfTotal : total - halfTotal;

                const mid = (rowCount - 1) / 2;
                const offset = colIdx - mid; 
                const normOffset = mid > 0 ? offset / mid : 0; 

                const stepX = usableWidth / Math.max(rowCount - 1, 1);
                const x = offset * stepX;
                const angle = normOffset * 15; 
                const archCurveY = Math.pow(normOffset, 2) * 26;
                const rowBaseY = row === 0 ? -44 : 44;
                const y = rowBaseY + archCurveY;

                cardEl.dataset.baseX = x;
                cardEl.dataset.baseY = y;
                cardEl.dataset.baseAngle = angle;
                cardEl.dataset.baseZ = (row * 50) + colIdx + 1;

                if (animateStagger) {
                    const delay = colIdx * 10 + row * 120;
                    setTimeout(() => {
                        applyCardTransform(cardEl);
                    }, delay);
                } else {
                    applyCardTransform(cardEl);
                }
            });
        }

        function updateSpreadLayout(animateStagger = false) {
            if (isMobileWheelMode()) {
                renderMobileWheel();
            } else {
                const deck = document.getElementById('deck');
                if (deck) deck.classList.remove('is-dragging');
                renderPCSpread(animateStagger);
            }
        }

        function setupDeckInteractions() {
            const deck = document.getElementById('deck');

            deck.addEventListener('pointerleave', (e) => {
                if (!isMobileWheelMode() && e.pointerType === 'mouse' && !isPointerDown) {
                    setPreviewCard(null);
                }
            });

            deck.addEventListener('pointerdown', (e) => {
                if (!canDraw) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;

                if (inertiaRafId) {
                    cancelAnimationFrame(inertiaRafId);
                    inertiaRafId = null;
                }

                isPointerDown = true;
                isDragging = false;
                dragDistance = 0;
                wheelVelocity = 0;

                pointerStartX = e.clientX;
                pointerStartY = e.clientY;
                lastMoveX = e.clientX;
                lastMoveTime = performance.now();
                downCardEl = e.target.closest('.card');
            });

            window.addEventListener('pointermove', (e) => {
                if (!isPointerDown || !canDraw) return;

                const dx = e.clientX - pointerStartX;
                const dy = e.clientY - pointerStartY;
                dragDistance = Math.hypot(dx, dy);

                if (!isDragging && dragDistance >= DRAG_THRESHOLD) {
                    isDragging = true;
                    deck.classList.add('is-dragging');
                    hideSwipeGuideArrows();
                    if (previewCardEl) {
                        setPreviewCard(null);
                    }
                }

                if (isDragging && isMobileWheelMode()) {
                    const now = performance.now();
                    const dt = Math.max(now - lastMoveTime, 1);
                    const stepDx = e.clientX - lastMoveX;

                    const sensitivity = window.innerWidth <= 420 ? 0.044 : 0.036;
                    const deltaCards = stepDx * sensitivity;

                    wheelOffset = clampWheelOffset(wheelOffset + deltaCards);

                    const instantVel = (deltaCards / dt) * 16.67;
                    wheelVelocity = wheelVelocity * 0.35 + instantVel * 0.65;

                    lastMoveX = e.clientX;
                    lastMoveTime = now;

                    renderMobileWheel();
                }
            }, { passive: true });

            function handlePointerEnd(e) {
                if (!isPointerDown) return;
                isPointerDown = false;

                if (isDragging || dragDistance >= DRAG_THRESHOLD) {
                    isDragging = false;
                    if (isMobileWheelMode() && Math.abs(wheelVelocity) > 0.01) {
                        startWheelInertia();
                    } else {
                        deck.classList.remove('is-dragging');
                    }
                    downCardEl = null;
                    return;
                }

                deck.classList.remove('is-dragging');
                const targetCard = downCardEl || (e.target && e.target.closest ? e.target.closest('.card') : null);
                downCardEl = null;

                if (targetCard) {
                    if (!isMobileWheelMode() && e.pointerType === 'mouse') {
                        confirmCardPick(targetCard);
                    } else {
                        handleCardTap(targetCard);
                    }
                } else {
                    setPreviewCard(null);
                }
            }

            window.addEventListener('pointerup', handlePointerEnd);
            window.addEventListener('pointercancel', handlePointerEnd);

            document.addEventListener('pointerdown', (e) => {
                if (!e.target.closest('#deck') && previewCardEl) {
                    setPreviewCard(null);
                }
            });
        }

        function handleCardTap(cardEl) {
            if (!canDraw || cardEl.classList.contains('is-picked-out')) return;
            hideSwipeGuideArrows();

            if (previewCardEl === cardEl) {
                confirmCardPick(cardEl);
            } else {
                setPreviewCard(cardEl);
            }
        }

        function confirmCardPick(cardEl) {
            if (!canDraw || cardEl.classList.contains('is-picked-out')) return;
            const worryText = document.getElementById('worry-input').value.trim();
            
            if (!worryText) {
                setPreviewCard(null);
                showNoticeModal({
                    icon: '🌊',
                    title: '고민을 먼저 들려주렴',
                    message: '무엇이 네 마음을 어지럽히는지 알려주어야\n바다도 답을 내어줄 수 있지 않겠니?\n먼저 고민부터 차분히 적어보렴.',
                    btnText: '고민 적으러 가기',
                    onClose: () => {
                        document.getElementById('worry-input').focus();
                    }
                });
                return;
            }

            const cardData = cardEl._cardData;
            cardEl.classList.remove('is-preview');
            cardEl.classList.add('is-picked-out');
            previewCardEl = null;

            applyCardTransform(cardEl);

            pickedCards.push(cardData);
            updateSlotUI(pickedCards.length - 1, cardData);
            updateGuideText();

            if (pickedCards.length === 3) {
                canDraw = false;
                setTimeout(() => {
                    showCounselModal(pickedCards);
                }, 600);
            }
        }

        function updateGuideText() {
            const guide = document.getElementById('pick-guide');
            const remain = 3 - pickedCards.length;
            if (remain > 0) {
                const labels = ['첫 번째', '두 번째', '세 번째'];
                guide.innerText = `고민을 떠올리며 ${labels[pickedCards.length]} 카드를 골라보렴. (남은 카드: ${remain}장)`;
            } else {
                guide.innerText = '세 장 모두 골랐구나. 어디 결과를 볼까.';
            }
        }

        function updateSlotUI(slotIdx, cardData) {
            const slot = document.getElementById(`slot-${slotIdx}`);
            if (!slot) return;
            slot.classList.add('filled');
            slot.querySelector('.slot-name').innerText = '선택 완료';
        }

        function resetSlotsUI() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (slot) {
                    slot.classList.remove('filled');
                    slot.querySelector('.slot-name').innerText = '선택 대기';
                }
            }
        }

        function getClientTimeInfo() {
            const now = new Date();
            const hour = now.getHours();
            const min = now.getMinutes();
            const ampm = hour < 12 ? '오전' : '오후';
            const displayHour = hour % 12 === 0 ? 12 : hour % 12;

            let periodLabel = '';
            if (hour >= 6 && hour < 11) {
                periodLabel = '아침(낮 시간대 - 밤/새벽 표현 금지)';
            } else if (hour >= 11 && hour < 18) {
                periodLabel = '한낮/오후(밝은 낮 시간대 - 밤/새벽/어두운 밤바다 표현 절대 금지)';
            } else if (hour >= 18 && hour < 21) {
                periodLabel = '저녁 시간대';
            } else {
                periodLabel = '밤/심야 시간대';
            }

            return {
                timeString: `${ampm} ${displayHour}시 ${min}분`,
                hour: hour,
                periodLabel: periodLabel
            };
        }

        async function showCounselModal(cards) {
            document.getElementById('three-cards-view').style.display = 'flex';
            document.getElementById('one-line-summary').style.display = 'none';
            currentOneLineAdvice = "";
            isEasterEggMode = false;

            cards.forEach((c, i) => {
                const mImg = document.getElementById(`mini-img-${i}`);
                mImg.style.display = 'block';
                mImg.src = `assets/${c.id}.jpg`;
            });

            document.getElementById('card-title').innerText = '🌊 닻의 타로 리딩';
            document.getElementById('card-desc').style.display = 'none';
            document.getElementById('loading-box').style.display = 'block';

            openModal();

            const worryText = document.getElementById('worry-input').value.trim();
            const clientTimeInfo = getClientTimeInfo();

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        worry: worryText,
                        cards: cards,
                        clientTimeInfo: clientTimeInfo
                    })
                });

                const data = await response.json();
                document.getElementById('loading-box').style.display = 'none';

                if (data.status === 'success') {
                    document.getElementById('card-desc').style.display = 'block';
                    const rawText = data.reading || "";
                    let mainReading = rawText;
                    let summaryAdvice = data.summary || "";

                    const match = rawText.match(/\[(한줄조언|한줄담소)\]\s*:?\s*(.+)/);
                    if (match) {
                        isEasterEggMode = (match[1] === '한줄담소'); 
                        summaryAdvice = match[2].trim();
                        mainReading = rawText.replace(match[0], '').trim();
                    } else if (!summaryAdvice) {
                        const sentences = mainReading.split(/(?<=[.!?])\s+/);
                        summaryAdvice = sentences[sentences.length - 1];
                    }

                    document.getElementById('card-desc').innerText = mainReading;

                    if (summaryAdvice) {
                        currentOneLineAdvice = summaryAdvice;
                        document.getElementById('summary-text').innerText = `"${summaryAdvice}"`;
                        document.getElementById('one-line-summary').style.display = 'block';
                    }
                } else {
                    closeResultModalOnly();
                    showNoticeModal({
                        icon: '🌊',
                        title: '파도가 거세어 응답이 늦어지는구나',
                        message: `지금은 해류가 조금 거친 모양이야.\n잠시 숨을 고른 뒤에 다시 카드를 골라보렴.\n(${data.message || '응답 지연'})`,
                        btnText: '카드 다시 뽑기',
                        onClose: () => {
                            shuffleAndSpread();
                        }
                    });
                }
            } catch (error) {
                document.getElementById('loading-box').style.display = 'none';
                closeResultModalOnly();
                showNoticeModal({
                    icon: '⚓',
                    title: '연결이 잠시 흔들렸구나',
                    message: '갑작스레 거센 파도가 일었는걸.\n잠시 후에 다시 카드를 골라보렴.',
                    btnText: '다시 시도하기',
                    onClose: () => {
                        shuffleAndSpread();
                    }
                });
            }
        }

        function openModal() {
            document.getElementById('modal-backdrop').style.display = 'block';
            document.getElementById('result-modal').style.display = 'block';
        }

        function closeResultModalOnly() {
            document.getElementById('modal-backdrop').style.display = 'none';
            document.getElementById('result-modal').style.display = 'none';
        }

        function closeAndShuffle() {
            const worryInput = document.getElementById('worry-input');
            if (worryInput) worryInput.value = '';

            closeResultModalOnly();
            shuffleAndSpread();
        }

        async function saveAdviceImage() {
            const modal = document.getElementById('result-modal');
            const saveBtn = document.getElementById('save-advice-btn');
            if (!modal) return;

            const originalText = saveBtn.innerText;
            saveBtn.innerText = '바다의 기록을 담는 중...';
            saveBtn.disabled = true;

            try {
                const canvas = await html2canvas(modal, {
                    backgroundColor: '#fdfbf7',
                    scale: 2,
                    useCORS: true,
                    onclone: (clonedDoc) => {
                        const clonedModal = clonedDoc.getElementById('result-modal');
                        if (clonedModal) {
                            clonedModal.style.position = 'static';
                            clonedModal.style.transform = 'none';
                            clonedModal.style.maxHeight = 'none';
                            clonedModal.style.height = 'auto';
                            clonedModal.style.overflow = 'visible';
                            clonedModal.style.boxShadow = 'none';
                            clonedModal.style.margin = '0';
                        }
                        const tBtn = clonedDoc.getElementById('twitter-btn');
                        const bGroup = clonedDoc.getElementById('modal-btn-group');
                        if (tBtn) tBtn.style.display = 'none';
                        if (bGroup) bGroup.style.display = 'none';
                    }
                });

                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                link.download = `바다의_조언_${timestamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('이미지 저장 오류:', err);
                showNoticeModal({
                    icon: '⚓',
                    title: '기록을 남기지 못했구나',
                    message: '저장하는 중에 작은 파도가 일었어.\n잠시 후 다시 시도해보렴.',
                    btnText: '확인'
                });
            } finally {
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            }
        }

        function shareTwitter() {
            if (pickedCards.length !== 3) return;
            const advicePart = currentOneLineAdvice ? `"${currentOneLineAdvice}"\n\n` : '';
            const shareMessage = isEasterEggMode
                ? '사르디나의 바다에서 담소를 나누었습니다🌊'
                : '사르디나의 바다에서 고민 상담을 받았습니다🌊';

            const text = `${advicePart}${shareMessage}\nhttps://tarot.sardina.love`;
            
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
